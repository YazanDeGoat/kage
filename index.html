<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KAGE AI</title>
  <style>
    /* ----- KAGE Dark Glassmorphism Base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 30% 10%, #1a1a2e, #0a0a0f);
      color: #e0e0e0;
      height: 100vh;
      height: 100dvh; /* dynamic viewport for mobile */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Main app container – glass card */
    .app-container {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      display: flex;
      background: rgba(10, 10, 20, 0.45);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      border-radius: 0; /* full screen on mobile, slight rounding on desktop handled by media query */
      overflow: hidden;
    }

    /* ----- Sidebar (glass panel) ----- */
    .sidebar {
      width: 280px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 10;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6c5ce7, #a363d5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }

    .logo-text {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #e0e0ff, #b0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      color: #b0b0c0;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-size: 0.95rem;
    }

    .nav-item i, .nav-item span {
      pointer-events: none;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #e0e0ff;
    }

    .nav-item.active {
      background: rgba(108, 92, 231, 0.15);
      color: #c0b0ff;
      box-shadow: inset 0 0 0 1px rgba(108, 92, 231, 0.3);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* ----- Main Chat Area ----- */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: transparent;
      min-width: 0;
    }

    /* Header */
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #d0d0e0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Icon buttons (glass) */
    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #c0c0d0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Messages container */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      scroll-behavior: smooth;
    }

    /* Message bubbles */
    .message {
      display: flex;
      gap: 0.8rem;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .bubble {
      background: rgba(20, 20, 35, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      padding: 0.9rem 1.2rem;
