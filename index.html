<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#050505"
  >
  <meta
    name="color-scheme"
    content="dark"
  >
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="KAGE"
  >
  <meta
    name="application-name"
    content="KAGE"
  >
  <meta
    name="description"
    content="KAGE — your personal AI system."
  >
  <title>KAGE</title>
  <!-- PWA -->
  <link
    rel="manifest"
    href="./manifest.json"
  >
  <!-- iOS -->
  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >
  <!-- KAGE UI -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>
<body>
  <!--
    KAGE mounts its application UI here.
    main.js remains the application entry point.
  -->
  <div id="app"></div>
  <!--
    Main KAGE application.
    Keep this as a module so existing imports/exports work.
  -->
  <script
    type="module"
    src="./main.js"
  ></script>
</body>
</html>
