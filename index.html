    }
    @media (min-width: 768px) {
      .app-shell { border-radius: 32px; height: 92%; }
    }

    /* header */
    .top-bar {
      display: flex;

    }
    .logo { font-weight: 600; font-size: 1.3rem; letter-spacing: 0.5px; color: #fff; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* glass icon buttons */
    .icon-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, border-color 0.2s;
      color: #ccc;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.25); color: #fff; }

    .profile-btn {

      padding: 6px 14px 6px 6px;

      align-items: center;

      justify-content: center;

      font-size: 0.8rem;
      color: white;
    }

      border: 1px solid rgba(255,255,255,0.05);
      line-height: 1.5;
    }
    .message.user {
      align-self: flex-end;
      background: rgba(59,130,246,0.2);

    }

    }

    .action-btn svg { width: 20px; height: 20px; }
    #send-btn { background: #3b82f6; border-color: #3b82f6; color: white; }
    #send-btn:hover { background: #2563eb; }

    /* hidden file input */
    #file-upload { display: none; }
  </style>
</head>
