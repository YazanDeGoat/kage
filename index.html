<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>KAGE</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div id="kage-identity-bar" aria-label="KAGE identity controls">

    <button
      id="kage-download-button"
      type="button"
      aria-label="Download KAGE"
    >
      ↓
      <span>Download KAGE</span>
    </button>

    <button
      id="kage-profile-button"
      type="button"
      aria-label="Open profile"
      aria-expanded="false"
    >
      <span id="kage-profile-avatar">○</span>
    </button>

  </div>

  <div
    id="kage-profile-menu"
    hidden
    aria-label="Profile menu"
  >
    <div id="kage-profile-menu-content"></div>
  </div>

  <div
    id="kage-install-menu"
    hidden
    aria-label="Install KAGE"
  >
    <div id="kage-install-menu-content"></div>
  </div>

  <div id="app"></div>

  <script type="module" src="/profile.js"></script>
  <script type="module" src="/profile-menu.js"></script>
  <script type="module" src="/kage-install.js"></script>
  <script type="module" src="/identity-controller.js"></script>
  <script type="module" src="/main.js"></script>

</body>
</html>
