<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#000000">
  <title>KAGE — Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      margin-bottom: 24px;
    }

    .status {
      border: 1px solid #202020;
      background: #050505;
      border-radius: 16px;
      padding: 24px;
    }

    .indicator {
      width: 12px;
      height: 12px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #777;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #999;
      line-height: 1.6;
    }

    .details {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">KAGE</div>

    <section class="status">
      <div class="indicator"></div>

      <h1>KAGE is offline</h1>

      <p>
        Your KAGE offline layer is active.
        Reconnect to the internet to continue using
        cloud-powered capabilities.
      </p>

      <div class="details">
        Offline foundation active
      </div>
    </section>
  </main>
</body>
</html>
