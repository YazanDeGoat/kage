<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#212121">
<link rel="manifest" href="/manifest.json">
<title>Kage</title>

<style>
:root {
  color-scheme: dark;
  --bg: #212121;
  --sidebar: #171717;
  --panel: #2f2f2f;
  --hover: #3a3a3a;
  --border: #414141;
  --text: #f5f5f5;
  --muted: #a0a0a0;
  --accent: #ffffff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
}

button, textarea, input { font: inherit; }
button { cursor: pointer; color: inherit; }

button:focus-visible,
textarea:focus-visible {
  outline: 2px solid white;
  outline-offset: 2px;
}

.app {
  display: flex;
  width: 100%;
  height: 100dvh;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--sidebar);
  padding: 12px;
  transition: transform .2s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 9px 20px;
  font-size: 19px;
  font-weight: 700;
}

.logo {
  width: 32px;
  height: 32px;
  border: 1px solid #777;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 17px;
}

.btn {
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 10px;
  padding: 10px 12px;
  transition: background .15s ease;
}

.btn:hover { background: var(--hover); }

.new-chat {
  text-align: left;
  margin-bottom: 22px;
}

.label {
  padding: 8px;
  color: var(--muted);
  font-size: 12px;
}

.chat-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
  padding: 11px 10px;
  margin-bottom: 3px;
  color: var(--text);
}

.chat-item:hover,
.chat-item.active { background: #2e2e2e; }

.chat-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  flex: 1;
}

.sidebar-bottom {
  border-top: 1px solid #303030;
  padding-top: 10px;
  display: grid;
  gap: 7px;
}

.sidebar-bottom .btn {
  border: 0;
  text-align: left;
  color: var(--muted);
}

.sidebar-bottom .btn:hover { color: var(--text); }

.status {
  padding: 8px;
  color: var(--muted);
  font-size: 11px;
}

.main {
  min-width: 0;
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px;
}

.top-left,
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar h1 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  border-radius: 9px;
  font-size: 18px;
}

.icon-btn:hover { background: var(--hover); }

.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 20px 40px;
  scroll-behavior: smooth;
}

.welcome {
  min-height: 75%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px 10px;
}

.welcome-logo {
  width: 55px;
  height: 55px;
  border: 1px solid #666;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 26px;
  margin-bottom: 23px;
}

.welcome h2 {
  margin: 0;
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 600;
  letter-spacing: -.7px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.6;
  max-width: 430px;
}

.suggestions {
  width: min(100%, 600px);
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 9px;
  margin-top: 24px;
}

.suggestion {
  text-align: left;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 15px;
}

.suggestion:hover { background: var(--panel); }

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 7px;
}

.suggestion span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.message {
  width: min(100%, 760px);
  margin: 0 auto 28px;
  display: flex;
  gap: 15px;
  align-items: flex-start;
}

.avatar {
  width: 31px;
  height: 31px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid #555;
  border-radius: 50%;
  font-weight: 700;
  font-size: 12px;
}

.message.assistant .avatar {
  background: white;
  color: black;
  border-color: white;
}

.message-body {
  min-width: 0;
  flex: 1;
  padding-top: 5px;
}

.message-name {
  font-weight: 600;
  font-size: 12px;
  margin-bottom: 9px;
}

.message-text {
  font-size: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message-text pre {
  white-space: pre-wrap;
  overflow-x: auto;
  overflow-wrap: anywhere;
  background: #111;
  border: 1px solid #393939;
  border-radius: 10px;
  padding: 14px;
}

.message-text code {
  font-family: Consolas, monospace;
  font-size: 13px;
}

.message-text a {
  color: white;
  text-decoration: underline;
}

.message-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.mini {
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  padding: 6px 8px;
  font-size: 11px;
}

.mini:hover {
  color: white;
  background: var(--hover);
}

.generated-image {
  display: block;
  max-width: 100%;
  width: min(100%, 600px);
  border-radius: 12px;
  margin-top: 12px;
}

.composer-area {
  width: 100%;
  padding: 10px 18px 15px;
}

.composer {
  width: min(100%, 800px);
  margin: auto;
  background: #303030;
  border: 1px solid #494949;
  border-radius: 25px;
  padding: 10px 12px;
}

.composer:focus-within {
  border-color: #686868;
}

#prompt {
  display: block;
  width: 100%;
  max-height: 180px;
  min-height: 42px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 10px 7px;
  line-height: 1.6;
}

#prompt::placeholder { color: #aaa; }

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 5px;
}

.tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
}

.tool {
  background: transparent;
  color: #d0d0d0;
  border: 0;
  border-radius: 9px;
  padding: 8px 9px;
  font-size: 12px;
}

.tool:hover,
.tool.selected { background: #484848; color: white; }

.send {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 20px;
  font-weight: 700;
}

.send:hover { background: #ddd; }
.send:disabled { opacity: .5; cursor: not-allowed; }

.hint {
  text-align: center;
  color: #888;
  font-size: 10px;
  margin: 10px auto 0;
}

.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 3px 5px 8px;
}

.file-chip {
  background: #414141;
  color: #eee;
  border: 1px solid #555;
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 11px;
}

.hidden { display: none !important; }

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #f5f5f5;
  color: #111;
  border-radius: 10px;
  padding: 11px 15px;
  z-index: 50;
  max-width: calc(100vw - 24px);
  box-shadow: 0 5px 25px #0006;
  font-size: 12px;
}

#fileInput { display: none; }

@media(max-width:760px) {
  .sidebar {
    position: fixed;
    z-index: 20;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(290px, 85vw);
    transform: translateX(-105%);
    box-shadow: 15px 0 40px #0008;
  }

  .sidebar.open { transform: translateX(0); }
  .topbar { padding: 8px 10px; }
  .messages { padding: 22px 13px 35px; }
  .composer-area { padding: 8px 8px 12px; }
  .suggestions { grid-template-columns: 1fr; }
  .welcome { min-height: 65%; }
  .message { gap: 10px; }
  .avatar { width: 28px; height: 28px; }
  .tool { padding: 8px 7px; }
  .hint { line-height: 1.5; }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">K</div>
      <span>Kage</span>
    </div>

    <button class="btn new-chat" id="newChat">＋ New chat</button>

    <div class="label">Chats</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <div class="status" id="networkStatus">● Online</div>
      <button class="btn" id="exportChats">↗ Export chats</button>
      <button class="btn" id="renameChat">✎ Rename chat</button>
      <button class="btn" id="deleteChat">Delete current chat</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="menuButton" aria-label="Menu">☰</button>
        <h1 id="currentTitle">Kage</h1>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="voiceMode" title="Voice mode">🎙</button>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer class="composer-area">
      <div class="composer">
        <div class="attachments" id="attachments"></div>

        <textarea id="prompt" rows="1"
          placeholder="Message Kage"
          aria-label="Message Kage"></textarea>

        <div class="composer-bottom">
          <div class="tools">
            <button class="tool" id="attachButton" title="Attach files">＋</button>
            <button class="tool" id="searchButton" title="Toggle web search">⌕ Search</button>
            <button class="tool" id="imageButton" title="Generate image">▧ Image</button>
            <button class="tool" id="micButton" title="Speak">🎙</button>
            <button class="tool selected" id="speakToggle" title="Read replies aloud">🔊</button>
          </div>

          <button class="send" id="sendButton" aria-label="Send">↑</button>
        </div>
      </div>

      <div class="hint">Kage can make mistakes. Check important information.</div>
      <input type="file" id="fileInput" multiple
        accept="image/*,video/*,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.html,.css,.py,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.sql,.xml,.yaml,.yml,.toml,.log,.sh">
    </footer>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE = "kage-chats-v3";
  const ACTIVE = "kage-active-v3";

  let chats = [];
  let activeId = null;
  let attachments = [];
  let searching = false;
  let imageMode = false;
  let speakReplies = true;
  let listening = false;
  let busy = false;
  let recognition = null;

  const makeId = () =>
    crypto.randomUUID ? crypto.randomUUID() :
    Date.now() + "-" + Math.random().toString(36).slice(2);

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(
      () => $("toast").classList.add("hidden"), 3000
    );
  }

  function activeChat() {
    return chats.find(chat => chat.id === activeId);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE, JSON.stringify(chats));
      localStorage.setItem(ACTIVE, activeId || "");
    } catch {
      toast("Storage is full. Export your chats and remove old conversations.");
    }
  }

  function newChat() {
    const chat = {
      id: makeId(),
      title: "New chat",
      messages: [],
      createdAt: Date.now()
    };

    chats.unshift(chat);
    activeId = chat.id;
    attachments = [];
    save();
    renderAll();
    $("prompt").focus();
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE) || "[]");
      chats = Array.isArray(data) ? data : [];
    } catch {
      chats = [];
    }

    activeId = localStorage.getItem(ACTIVE);
    if (!chats.some(chat => chat.id === activeId)) activeId = null;

    if (!activeId && chats.length) activeId = chats[0].id;
    if (!activeId) {
      const chat = {
        id: makeId(),
        title: "New chat",
        messages: [],
        createdAt: Date.now()
      };
      chats.push(chat);
      activeId = chat.id;
    }

    renderAll();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function markdown(value) {
    let html = escapeHtml(value);

    html = html.replace(/```([\w-]*)\n([\s\S]*?)```/g,
      (_, lang, code) => `<pre><code>${code}</code></pre>`);

    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    html = html.replace(/\n/g, "<br>");

    html = html.replace(
      /https?:\/\/[^\s<]+/g,
      url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
    );

    return html;
  }

  function renderWelcome(container) {
    container.innerHTML = `
      <div class="welcome">
        <div class="welcome-logo">K</div>
        <h2>What can I help with?</h2>
        <p>Ask anything, work on code, upload a file, or create something new.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me write some code.">
            <strong>⌘ Code</strong>
            <span>Build and fix projects</span>
          </button>
          <button class="suggestion" data-prompt="Explain a difficult topic simply.">
            <strong>✧ Learn</strong>
            <span>Understand something new</span>
          </button>
          <button class="suggestion" data-prompt="Help me come up with a creative idea.">
            <strong>✎ Create</strong>
            <span>Explore an idea</span>
          </button>
          <button class="suggestion" data-prompt="Search the web for the latest AI news.">
            <strong>⌕ Search</strong>
            <span>Find current information</span>
          </button>
        </div>
      </div>`;

    container.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        $("prompt").value = button.dataset.prompt;
        resizeInput();
        $("prompt").focus();
      });
    });
  }

  function renderChats() {
    const list = $("chatList");
    list.replaceChildren();

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "chat-item" +
        (chat.id === activeId ? " active" : "");

      const icon = document.createElement("span");
      icon.textContent = "◦";

      const title = document.createElement("span");
      title.className = "chat-title";
      title.textContent = chat.title;

      button.append(icon, title);

      button.onclick = () => {
        activeId = chat.id;
        attachments = [];
        save();
        renderAll();
        $("sidebar").classList.remove("open");
      };

      button.oncontextmenu = event => {
        event.preventDefault();
        renameChat(chat);
      };

      list.append(button);
    });
  }

  function renderMessages() {
    const container = $("messages");
    container.replaceChildren();

    const chat = activeChat();
    $("currentTitle").textContent = chat?.title || "Kage";

    if (!chat || !chat.messages.length) {
      renderWelcome(container);
      return;
    }

    chat.messages.forEach((message, index) => {
      const row = document.createElement("article");
      row.className = "message " + message.role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.role === "assistant" ? "K" : "Y";

      const body = document.createElement("div");
      body.className = "message-body";

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = message.role === "assistant" ? "Kage" : "You";

      const text = document.createElement("div");
      text.className = "message-text";
      text.innerHTML = markdown(message.content || "");

      body.append(name, text);

      if (message.imageUrl) {
        const image = document.createElement("img");
        image.className = "generated-image";
        image.src = message.imageUrl;
        image.alt = "Image generated by Kage";
        body.append(image);
      }

      if (message.fileNames?.length) {
        const chips = document.createElement("div");
        chips.className = "attachments";

        message.fileNames.forEach(fileName => {
          const chip = document.createElement("span");
          chip.className = "file-chip";
          chip.textContent = "📎 " + fileName;
          chips.append(chip);
        });

        body.append(chips);
      }

      const tools = document.createElement("div");
      tools.className = "message-tools";

      const copy = document.createElement("button");
      copy.className = "mini";
      copy.textContent = "Copy";
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.content || "");
          toast("Copied.");
        } catch {
          toast("Clipboard permission was blocked.");
        }
      };
      tools.append(copy);

      if (message.role === "assistant") {
        const speak = document.createElement("button");
        speak.className = "mini";
        speak.textContent = "Read aloud";
        speak.onclick = () => speakText(message.content);
        tools.append(speak);
      } else {
        const edit = document.createElement("button");
        edit.className = "mini";
        edit.textContent = "Edit";
        edit.onclick = () => {
          $("prompt").value = message.content;
          chat.messages = chat.messages.slice(0, index);
          save();
          renderAll();
          resizeInput();
          $("prompt").focus();
        };
        tools.append(edit);
      }

      body.append(tools);
      row.append(avatar, body);
      container.append(row);
    });

    container.scrollTop = container.scrollHeight;
  }

  function renderAttachments() {
    const area = $("attachments");
    area.replaceChildren();

    attachments.forEach((file, index) => {
      const chip = document.createElement("button");
      chip.className = "file-chip";
      chip.textContent = "× " + file.name;
      chip.title = "Remove attachment";
      chip.onclick = () => {
        attachments.splice(index, 1);
        renderAttachments();
      };
      area.append(chip);
    });
  }

  function renderAll() {
    renderChats();
    renderMessages();
    renderAttachments();
  }

  function resizeInput() {
    const input = $("prompt");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  async function readFile(file) {
    if (file.size > 4 * 1024 * 1024) {
      throw new Error(file.name + " exceeds the 4 MB limit in this version.");
    }

    const item = {
      name: file.name,
      type: file.type,
      text: "",
      image: null
    };

    if (file.type.startsWith("image/")) {
      item.image = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    } else if (file.type.startsWith("video/")) {
      item.text = await videoFrames(file);
    } else if (/\.(txt|md|csv|json|js|ts|jsx|tsx|html|css|py|java|c|cpp|h|cs|php|rb|go|rs|sql|xml|yaml|yml|toml|log|sh)$/i.test(file.name)) {
      item.text = (await file.text()).slice(0, 20000);
    } else {
      item.text = "[File attached: " + file.name +
        ". This file type is not text-extracted in this version.]";
    }

    return item;
  }

  async function videoFrames(file) {
    const url = URL.createObjectURL(file);

    try {
      const video = document.createElement("video");
      video.preload = "metadata";
      video.muted = true;
      video.src = url;

      await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error("Could not read the video."));
      });

      if (!Number.isFinite(video.duration) || !video.videoWidth) {
        return "[Video attached. Frames could not be extracted.]";
      }

      const times = [
        Math.min(0.5, video.duration / 4),
        video.duration / 2,
        Math.max(0, video.duration - 0.5)
      ];

      const frames = [];

      for (const time of [...new Set(times)]) {
        video.currentTime = time;
        await new Promise(resolve => video.onseeked = resolve);

        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 180;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, 320, 180);
        frames.push(canvas);
      }

      const sheet = document.createElement("canvas");
      sheet.width = 320 * frames.length;
      sheet.height = 180;

      const ctx = sheet.getContext("2d");
      frames.forEach((frame, index) => {
        ctx.drawImage(frame, index * 320, 0);
      });

      return "[Video duration: " + Math.round(video.duration) +
        " seconds. Sampled-frame contact sheet: " +
        sheet.toDataURL("image/jpeg", 0.7) + "]";
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function getImage() {
    const image = attachments.find(file => file.image);
    if (image) return image.image;

    const video = attachments.find(file => file.text.includes("data:image/jpeg;base64,"));
    if (video) {
      const match = video.text.match(/(data:image\/jpeg;base64,[A-Za-z0-9+/=]+)/);
      if (match) return match[1];
    }

    return null;
  }

  function fileContext() {
    return attachments
      .filter(file => file.text)
      .map(file => "ATTACHED FILE: " + file.name + "\n" + file.text)
      .join("\n\n")
      .slice(0, 30000);
  }

  async function searchWeb(query) {
    const response = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Search failed.");
    return data;
  }

  async function sendMessage() {
    if (busy) return;

    const prompt = $("prompt").value.trim();
    if (!prompt && !attachments.length) return;

    if (!navigator.onLine) {
      toast("You're offline. Your saved chats are available, but cloud AI needs internet.");
      return;
    }

    const chat = activeChat();
    if (!chat) return;

    busy = true;
    $("sendButton").disabled = true;

    const names = attachments.map(file => file.name);
    const image = getImage();
    const context = fileContext();

    const userText = prompt || "Please inspect my attachment.";

    chat.messages.push({
      role: "user",
      content: userText,
      fileNames: names,
      createdAt: Date.now()
    });

    if (chat.title === "New chat") {
      chat.title = userText.replace(/\s+/g, " ").slice(0, 32) || names[0] || "New chat";
    }

    $("prompt").value = "";
    resizeInput();
    attachments = [];
    save();
    renderAll();

    try {
      let searchResults = [];

      if (searching) {
        const search = await searchWeb(userText);
        searchResults = search.results || [];

        if (!searchResults.length) {
          toast(search.message || "No search results found.");
        }
      }

      const messages = chat.messages
        .slice(-16)
        .map(message => ({
          role: message.role,
          content: message.content
        }));

      if (context && messages.length) {
        messages[messages.length - 1].content += "\n\n" + context;
      }

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages,
          image,
          searchResults
        })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Kage could not respond.");

      const answer = {
        role: "assistant",
        content: data.reply || "No response was returned.",
        createdAt: Date.now()
      };

      chat.messages.push(answer);
      save();
      renderAll();

      if (speakReplies) speakText(answer.content);
    } catch (error) {
      chat.messages.push({
        role: "assistant",
        content: "I couldn't complete that request: " + error.message,
        createdAt: Date.now()
      });
      save();
      renderAll();
    } finally {
      busy = false;
      $("sendButton").disabled = false;
      $("prompt").focus();
    }
  }

  async function generateImage() {
    const prompt = $("prompt").value.trim();
    if (!prompt) {
      toast("Describe the image first.");
      return;
    }

    if (!navigator.onLine) {
      toast("Image generation requires internet.");
      return;
    }

    if (busy) return;
    busy = true;
    $("sendButton").disabled = true;

    const chat = activeChat();

    chat.messages.push({
      role: "user",
      content: "Generate an image: " + prompt,
      createdAt: Date.now()
    });

    const resultMessage = {
      role: "assistant",
      content: "Generating image…",
      createdAt: Date.now()
    };

    chat.messages.push(resultMessage);
    $("prompt").value = "";
    resizeInput();
    save();
    renderAll();

    try {
      const response = await fetch("/api/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Image generation failed.");
      }

      const blob = await response.blob();
      resultMessage.imageUrl = URL.createObjectURL(blob);
      resultMessage.content = "Here is your generated image.";

      save();
      renderAll();
    } catch (error) {
      resultMessage.content = error.message;
      save();
      renderAll();
    } finally {
      busy = false;
      $("sendButton").disabled = false;
    }
  }

  async function speakText(text) {
    if (!text) return;

    if (!navigator.onLine) {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } else {
        toast("Speech playback is unavailable.");
      }
      return;
    }

    try {
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text.slice(0, 4000) })
      });

      if (!response.ok) throw new Error("Cloud voice failed.");

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);

      audio.onended = () => URL.revokeObjectURL(url);
      await audio.play();
    } catch {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } else {
        toast("Voice playback failed.");
      }
    }
  }

  function startListening() {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      toast("Speech input isn't supported in this browser.");
      return;
    }

    if (recognition) {
      recognition.stop();
      recognition = null;
      listening = false;
      $("micButton").classList.remove("selected");
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = navigator.language || "en-US";
    recognition.continuous = false;
    recognition.interimResults = true;

    let finalText = "";

    recognition.onstart = () => {
      listening = true;
      $("micButton").classList.add("selected");
      toast("Listening…");
    };

    recognition.onresult = event => {
      let interim = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const phrase = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += phrase;
        else interim += phrase;
      }

      $("prompt").value = (finalText + " " + interim).trim();
      resizeInput();
    };

    recognition.onerror = () => toast("Microphone error. Check browser permissions.");

    recognition.onend = () => {
      listening = false;
      recognition = null;
      $("micButton").classList.remove("selected");
    };

    recognition.start();
  }

  function renameChat(chat = activeChat()) {
    if (!chat) return;

    const name = prompt("Rename this chat:", chat.title);
    if (name && name.trim()) {
      chat.title = name.trim().slice(0, 100);
      save();
      renderAll();
    }
  }

  $("newChat").onclick = newChat;
  $("sendButton").onclick = () => imageMode ? generateImage() : sendMessage();
  $("attachButton").onclick = () => $("fileInput").click();
  $("micButton").onclick = startListening;
  $("voiceMode").onclick = () => {
    startListening();
    toast("Speak your message, then press send. Replies can be read aloud.");
  };

  $("prompt").addEventListener("input", resizeInput);

  $("prompt").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      imageMode ? generateImage() : sendMessage();
    }
  });

  $("fileInput").addEventListener("change", async event => {
    for (const file of [...event.target.files]) {
      try {
        attachments.push(await readFile(file));
      } catch (error) {
        toast(error.message);
      }
    }

    renderAttachments();
    event.target.value = "";
  });

  $("searchButton").onclick = () => {
    searching = !searching;
    $("searchButton").classList.toggle("selected", searching);
    toast(searching ? "Web search enabled." : "Web search disabled.");
  };

  $("imageButton").onclick = () => {
    imageMode = !imageMode;
    $("imageButton").classList.toggle("selected", imageMode);
    $("prompt").placeholder = imageMode
      ? "Describe the image you want..."
      : "Message Kage";
    toast(imageMode ? "Image generation mode." : "Chat mode.");
  };

  $("speakToggle").onclick = () => {
    speakReplies = !speakReplies;
    $("speakToggle").classList.toggle("selected", speakReplies);
    $("speakToggle").textContent = speakReplies ? "🔊" : "🔇";
  };

  $("menuButton").onclick = () => $("sidebar").classList.toggle("open");
  $("renameChat").onclick = () => renameChat();

  $("deleteChat").onclick = () => {
    const chat = activeChat();
    if (!chat || !confirm("Delete this chat?")) return;

    chats = chats.filter(item => item.id !== chat.id);
    activeId = chats[0]?.id || null;

    if (!activeId) {
      const replacement = {
        id: makeId(),
        title: "New chat",
        messages: [],
        createdAt: Date.now()
      };
      chats.push(replacement);
      activeId = replacement.id;
    }

    save();
    renderAll();
  };

  $("exportChats").onclick = () => {
    const blob = new Blob([JSON.stringify(chats, null, 2)], {
      type: "application/json"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "kage-chats.json";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  function updateNetwork() {
    $("networkStatus").textContent =
      navigator.onLine ? "● Online" : "● Offline";
  }

  window.addEventListener("online", updateNetwork);
  window.addEventListener("offline", updateNetwork);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  load();
  updateNetwork();
})();
</script>
</body>
</html>
