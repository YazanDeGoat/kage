<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <meta name="description" content="Kage AI workspace">
  <link rel="manifest" href="/manifest.json">
  <title>Kage AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b14;
      --panel: rgba(255,255,255,.065);
      --panel-hover: rgba(255,255,255,.105);
      --border: rgba(255,255,255,.12);
      --text: #f6f7ff;
      --muted: #9ba3bb;
      --accent: #a78bfa;
      --accent2: #67e8f9;
      --danger: #ff7d9c;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(105,75,230,.23), transparent 36%),
        radial-gradient(ellipse at 85% 90%, rgba(27,175,207,.14), transparent 35%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea, input { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: 265px minmax(0,1fr);
      gap: 13px;
      padding: 13px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 18px 65px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.035);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 16px;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 4px 18px;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-weight: 850;
      font-size: 21px;
      background: linear-gradient(135deg, #a78bfa, #67e8f9);
      color: #111323;
      box-shadow: 0 0 35px rgba(167,139,250,.23);
    }

    .brand strong { display: block; font-size: 18px; letter-spacing: .2px; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); }

    .btn {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      padding: 11px 13px;
      transition: .18s ease;
    }

    .btn:hover { background: var(--panel-hover); transform: translateY(-1px); }
    .btn.primary {
      color: #10111d;
      font-weight: 750;
      border: 0;
      background: linear-gradient(120deg, #c4b5fd, #67e8f9);
    }

    .new-chat { width: 100%; margin-bottom: 20px; }

    .section-label {
      margin: 2px 8px 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-size: 10px;
      font-weight: 750;
    }

    .chat-list { overflow-y: auto; flex: 1; min-height: 0; }

    .chat-item {
      width: 100%;
      text-align: left;
      display: flex;
      gap: 9px;
      align-items: center;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 13px;
      padding: 11px 10px;
      margin-bottom: 4px;
    }

    .chat-item.active, .chat-item:hover {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255,255,255,.075);
    }

    .chat-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 2px;
    }

    .dot {
      width: 7px;
      height: 7px;
      display: inline-block;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 6px;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 { font-size: 16px; margin: 0; font-weight: 750; }
    .topbar p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .pill {
      color: #c4b5fd;
      border: 1px solid rgba(167,139,250,.25);
      background: rgba(167,139,250,.09);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      white-space: nowrap;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px max(18px, calc((100% - 850px)/2));
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 0;
    }

    .welcome-orb {
      width: 82px;
      height: 82px;
      border-radius: 29px;
      display: grid;
      place-items: center;
      font-size: 36px;
      color: #111323;
      background: linear-gradient(135deg, #c4b5fd, #67e8f9);
      box-shadow: 0 0 80px rgba(167,139,250,.17);
      margin-bottom: 24px;
    }

    .welcome h2 { margin: 0; font-size: clamp(27px, 4vw, 40px); letter-spacing: -1.4px; }
    .welcome p { color: var(--muted); max-width: 430px; line-height: 1.65; font-size: 14px; }

    .suggestions {
      width: min(100%, 620px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 17px;
    }

    .suggestion {
      text-align: left;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: var(--muted);
    }

    .suggestion strong { color: var(--text); display: block; margin-bottom: 5px; font-size: 12px; }
    .suggestion span { font-size: 11px; }

    .message {
      margin: 0 auto 24px;
      max-width: 850px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 800;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #c4b5fd, #67e8f9);
      color: #111323;
      border: 0;
    }

    .message-content { min-width: 0; flex: 1; padding-top: 3px; }
    .message-head { font-size: 12px; font-weight: 750; margin-bottom: 9px; }
    .message-text { line-height: 1.72; font-size: 14px; overflow-wrap: anywhere; }
    .message-text pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: rgba(0,0,0,.35);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px;
      overflow-x: auto;
    }
    .message-text code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .message-text a { color: #a5f3fc; }
    .message-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .mini {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      padding: 6px 9px;
      font-size: 11px;
    }

    .attachment-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .file-chip {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      padding: 8px 10px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .generated-image {
      display: block;
      width: min(100%, 650px);
      border-radius: 17px;
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    .composer-area {
      padding: 12px 18px 16px;
      border-top: 1px solid var(--border);
    }

    .composer {
      width: min(100%, 900px);
      margin: auto;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 23px;
      background: rgba(6,8,16,.58);
      box-shadow: 0 10px 45px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.04);
      padding: 12px;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 45px;
      max-height: 170px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 9px 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #727b96; }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .composer-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tool {
      min-width: 37px;
      height: 35px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 0 9px;
      font-size: 12px;
    }

    .tool:hover, .tool.selected { background: rgba(255,255,255,.09); color: var(--text); border-color: var(--border); }
    .send { width: 40px; height: 38px; padding: 0; font-size: 18px; border-radius: 13px; }

    .hint {
      width: min(100%, 900px);
      margin: 9px auto 0;
      text-align: center;
      color: #707992;
      font-size: 10px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: calc(100vw - 24px);
      padding: 11px 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(22,25,40,.94);
      box-shadow: 0 10px 35px #0005;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; padding: 7px; gap: 0; }
      .sidebar {
        position: fixed;
        z-index: 10;
        inset: 7px auto 7px 7px;
        width: min(290px, calc(100vw - 35px));
        transform: translateX(-110%);
        transition: transform .22s ease;
        background: rgba(12,14,26,.96);
      }
      .sidebar.open { transform: translateX(0); }
      .main { height: calc(100dvh - 14px); }
      .topbar { padding: 12px 14px; min-height: 64px; }
      .messages { padding: 20px 13px; }
      .composer-area { padding: 9px 9px 12px; }
      .pill { display: none; }
      .suggestions { grid-template-columns: 1fr; }
      .welcome { justify-content: center; }
      .message { gap: 9px; margin-bottom: 21px; }
      .avatar { flex-basis: 30px; width: 30px; height: 30px; }
      .composer { border-radius: 19px; }
      .tool { min-width: 33px; padding: 0 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar glass" id="sidebar">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <strong>Kage</strong>
        <small>your AI workspace</small>
      </div>
    </div>

    <button class="btn primary new-chat" id="newChat">＋ New chat</button>
    <div class="section-label">Your conversations</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <div class="status-line">
        <span><span class="dot"></span>App ready</span>
        <span id="networkStatus">Online</span>
      </div>
      <button class="btn" id="exportChats">Export chat backup</button>
      <button class="btn" id="clearChat">Delete current chat</button>
    </div>
  </aside>

  <main class="main glass">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <button class="btn" id="menuButton" aria-label="Open menu">☰</button>
        <div>
          <h1 id="currentTitle">New conversation</h1>
          <p id="subtitle">Glass workspace · Cloud AI</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill">✦ KAGE AI</span>
        <button class="btn" id="voiceMode" title="Voice mode">◉ Voice</button>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-orb">K</div>
        <h2>What are we building today?</h2>
        <p>Ask a question, explore an idea, upload a file, write code, or generate an image.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me build a real AI app, step by step.">
            <strong>⌘ Build something</strong>
            <span>Plan and write code</span>
          </button>
          <button class="suggestion" data-prompt="Explain a difficult topic in simple language.">
            <strong>✧ Learn anything</strong>
            <span>Understand a hard topic</span>
          </button>
          <button class="suggestion" data-prompt="Give me a creative image idea and help me generate it.">
            <strong>▧ Create an image</strong>
            <span>Turn an idea into art</span>
          </button>
          <button class="suggestion" data-prompt="Search the web for the latest information about AI.">
            <strong>⌕ Search the web</strong>
            <span>Look for fresh information</span>
          </button>
        </div>
      </div>
    </section>

    <footer class="composer-area">
      <div class="composer">
        <div id="attachmentPreview" class="attachment-preview"></div>
        <textarea id="prompt" rows="1" placeholder="Message Kage..." aria-label="Message Kage"></textarea>

        <div class="composer-bottom">
          <div class="composer-tools">
            <button class="tool" id="attachButton" title="Attach files">＋ Attach</button>
            <button class="tool" id="searchButton" title="Search the web">⌕ Search</button>
            <button class="tool" id="imageButton" title="Generate an image">▧ Image</button>
            <button class="tool" id="micButton" title="Speak your message">🎙</button>
            <button class="tool" id="speakToggle" title="Speak Kage's replies">🔊 Voice on</button>
          </div>
          <button class="btn primary send" id="sendButton" title="Send">↑</button>
        </div>
      </div>
      <div class="hint">Kage can make mistakes. Check important information.</div>
      <input id="fileInput" type="file" multiple class="hidden"
        accept="image/*,video/*,.txt,.md,.csv,.json,.js,.ts,.jsx,.tsx,.html,.css,.py,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.sql,.xml,.yaml,.yml,.toml,.log,.sh,.pdf,.docx">
    </footer>
  </main>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "kage-glass-chats-v2";
  const ACTIVE_KEY = "kage-glass-active-v2";

  let chats = [];
  let activeId = null;
  let attachments = [];
  let searchEnabled = false;
  let imageMode = false;
  let voiceEnabled = true;
  let recognition = null;
  let busy = false;

  function id() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2);
  }

  function toast(message) {
    const node = $("toast");
    node.textContent = message;
    node.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.add("hidden"), 3200);
  }

  function currentChat() {
    return chats.find(chat => chat.id === activeId);
  }

  function save() {
    try {
      // Store messages, not temporary image payloads or large file contents.
      const safeChats = chats.map(chat => ({
        ...chat,
        messages: chat.messages.map(message => ({
          role: message.role,
          content: message.content,
          createdAt: message.createdAt,
          attachmentNames: message.attachmentNames || [],
          imageUrl: message.imageUrl || null
        }))
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(safeChats));
      localStorage.setItem(ACTIVE_KEY, activeId || "");
    } catch {
      toast("Storage is full. Export your chat backup and remove old chats.");
    }
  }

  function load() {
    try {
      chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(chats)) chats = [];
    } catch {
      chats = [];
    }

    activeId = localStorage.getItem(ACTIVE_KEY);
    if (!chats.some(chat => chat.id === activeId)) activeId = null;

    if (!activeId) createChat(false);
    renderAll();
  }

  function createChat(shouldSave = true) {
    const chat = {
      id: id(),
      title: "New conversation",
      messages: [],
      createdAt: Date.now()
    };
    chats.unshift(chat);
    activeId = chat.id;
    attachments = [];
    if (shouldSave) save();
    renderAll();
    $("prompt").focus();
  }

  function setTitleFromMessage(chat, text) {
    if (chat.title !== "New conversation") return;
    const clean = text.trim().replace(/\s+/g, " ");
    chat.title = clean.length > 34 ? clean.slice(0, 34) + "…" : clean || "New conversation";
  }

  function renderChatList() {
    const list = $("chatList");
    list.replaceChildren();

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "chat-item" + (chat.id === activeId ? " active" : "");

      const icon = document.createElement("span");
      icon.textContent = "◌";

      const title = document.createElement("span");
      title.className = "chat-title";
      title.textContent = chat.title;

      button.append(icon, title);
      button.title = "Click to open. Right-click for rename or delete.";

      button.addEventListener("click", () => {
        activeId = chat.id;
        attachments = [];
        save();
        renderAll();
        $("sidebar").classList.remove("open");
      });

      button.addEventListener("contextmenu", event => {
        event.preventDefault();
        const choice = prompt(
          "Type R to rename this chat, or D to delete it."
        );

        if (choice?.toLowerCase() === "r") {
          const name = prompt("New chat name:", chat.title);
          if (name?.trim()) {
            chat.title = name.trim().slice(0, 100);
            save();
            renderAll();
          }
        } else if (choice?.toLowerCase() === "d") {
          if (confirm("Delete this conversation?")) {
            chats = chats.filter(item => item.id !== chat.id);
            if (activeId === chat.id) activeId = chats[0]?.id || null;
            if (!activeId) createChat(false);
            save();
            renderAll();
          }
        }
      });

      list.append(button);
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function renderMarkdown(text) {
    // Small safe formatter for common markdown and code blocks.
    // Raw HTML is escaped before any basic formatting is added.
    let html = escapeHtml(text);

    html = html.replace(/```([\w-]*)\n([\s\S]*?)```/g,
      (_, language, code) =>
        `<pre><code>${code}</code></pre>`
    );

    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    html = html.replace(/\n/g, "<br>");

    html = html.replace(
      /https?:\/\/[^\s<]+/g,
      url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
    );

    return html;
  }

  function renderMessages() {
    const container = $("messages");
    container.replaceChildren();

    const chat = currentChat();
    $("currentTitle").textContent = chat?.title || "New conversation";

    if (!chat || chat.messages.length === 0) {
      const welcome = $("welcome");
      // Recreate welcome safely without using untrusted HTML.
      const section = document.createElement("div");
      section.className = "welcome";
      section.innerHTML = `
        <div class="welcome-orb">K</div>
        <h2>What are we building today?</h2>
        <p>Ask a question, explore an idea, upload a file, write code, or generate an image.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me build a real AI app, step by step."><strong>⌘ Build something</strong><span>Plan and write code</span></button>
          <button class="suggestion" data-prompt="Explain a difficult topic in simple language."><strong>✧ Learn anything</strong><span>Understand a hard topic</span></button>
          <button class="suggestion" data-prompt="Give me a creative image idea and help me generate it."><strong>▧ Create an image</strong><span>Turn an idea into art</span></button>
          <button class="suggestion" data-prompt="Search the web for the latest information about AI."><strong>⌕ Search the web</strong><span>Look for fresh information</span></button>
        </div>`;
      container.append(section);
      section.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          $("prompt").value = button.dataset.prompt;
          autoSize();
          $("prompt").focus();
        });
      });
      return;
    }

    chat.messages.forEach((message, index) => {
      const row = document.createElement("article");
      row.className = "message " + message.role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.role === "assistant" ? "K" : "Y";

      const content = document.createElement("div");
      content.className = "message-content";

      const head = document.createElement("div");
      head.className = "message-head";
      head.textContent = message.role === "assistant" ? "Kage" : "You";

      const text = document.createElement("div");
      text.className = "message-text";
      text.innerHTML = renderMarkdown(message.content);

      content.append(head, text);

      if (message.imageUrl) {
        const image = document.createElement("img");
        image.className = "generated-image";
        image.src = message.imageUrl;
        image.alt = "Image generated by Kage";
        content.append(image);
      }

      if (message.attachmentNames?.length) {
        const files = document.createElement("div");
        files.className = "attachment-preview";
        message.attachmentNames.forEach(name => {
          const chip = document.createElement("span");
          chip.className = "file-chip";
          chip.textContent = "📎 " + name;
          files.append(chip);
        });
        content.append(files);
      }

      const tools = document.createElement("div");
      tools.className = "message-tools";

      const copy = document.createElement("button");
      copy.className = "mini";
      copy.textContent = "Copy";
      copy.onclick = () => navigator.clipboard.writeText(message.content)
        .then(() => toast("Copied."))
        .catch(() => toast("Copy was blocked by the browser."));

      tools.append(copy);

      if (message.role === "assistant") {
        const speak = document.createElement("button");
        speak.className = "mini";
        speak.textContent = "Speak";
        speak.onclick = () => speakText(message.content);
        tools.append(speak);
      }

      if (message.role === "user") {
        const edit = document.createElement("button");
        edit.className = "mini";
        edit.textContent = "Edit & resend";
        edit.onclick = () => {
          $("prompt").value = message.content;
          attachments = [];
          autoSize();
          $("prompt").focus();
          toast("Edit the message, then press send.");
        };
        tools.append(edit);
      }

      content.append(tools);
      row.append(avatar, content);
      container.append(row);
    });

    container.scrollTop = container.scrollHeight;
  }

  function renderAll() {
    renderChatList();
    renderMessages();
    renderAttachments();
  }

  function renderAttachments() {
    const preview = $("attachmentPreview");
    preview.replaceChildren();

    attachments.forEach((file, index) => {
      const chip = document.createElement("button");
      chip.className = "file-chip";
      chip.textContent = "✕ " + file.name;
      chip.title = "Remove attachment";
      chip.onclick = () => {
        attachments.splice(index, 1);
        renderAttachments();
      };
      preview.append(chip);
    });
  }

  function autoSize() {
    const textarea = $("prompt");
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 170) + "px";
  }

  async function readFile(file) {
    const maxBytes = 4 * 1024 * 1024;

    if (file.size > maxBytes) {
      throw new Error(file.name + " is over 4 MB. Use a smaller file.");
    }

    const item = {
      name: file.name,
      type: file.type || "application/octet-stream",
      text: "",
      imageData: null,
      video: false
    };

    if (file.type.startsWith("image/")) {
      item.imageData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    } else if (file.type.startsWith("video/")) {
      item.video = true;
      item.text = await extractVideoFrames(file);
    } else if (
      /\.(txt|md|csv|json|js|ts|jsx|tsx|html|css|py|java|c|cpp|h|cs|php|rb|go|rs|sql|xml|yaml|yml|toml|log|sh)$/i.test(file.name)
    ) {
      item.text = await file.text();
      item.text = item.text.slice(0, 25000);
    } else if (/\.pdf$/i.test(file.name)) {
      item.text = "[PDF attached: " + file.name +
        ". PDF text extraction is not enabled in this version.]";
    } else if (/\.docx$/i.test(file.name)) {
      item.text = "[DOCX attached: " + file.name +
        ". DOCX text extraction is not enabled in this version.]";
    } else {
      item.text = "[Attached file: " + file.name +
        ". This file type is not directly readable in this version.]";
    }

    return item;
  }

  async function extractVideoFrames(file) {
    // Extract a few frames in the browser and create a contact sheet.
    // The video itself is not uploaded as a playable video to the AI model.
    const url = URL.createObjectURL(file);

    try {
      const video = document.createElement("video");
      video.muted = true;
      video.preload = "metadata";
      video.src = url;

      await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error("Could not read this video."));
      });

      const duration = video.duration;
      if (!Number.isFinite(duration) || duration <= 0) {
        return "[Video attached, but its duration could not be read.]";
      }

      const frames = [];
      const times = [...new Set([
        Math.min(0.5, duration / 4),
        duration / 2,
        Math.max(0, duration - 0.5)
      ])];

      for (const time of times) {
        video.currentTime = time;
        await new Promise(resolve => {
          video.onseeked = resolve;
        });

        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 200;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = Math.min(320 / video.videoWidth, 200 / video.videoHeight);
        const width = video.videoWidth * scale;
        const height = video.videoHeight * scale;

        ctx.drawImage(video, (320 - width) / 2, (200 - height) / 2, width, height);
        frames.push(canvas);
      }

      const sheet = document.createElement("canvas");
      sheet.width = 320 * frames.length;
      sheet.height = 200;

      const context = sheet.getContext("2d");
      frames.forEach((frame, index) => {
        context.drawImage(frame, index * 320, 0);
      });

      const dataUrl = sheet.toDataURL("image/jpeg", 0.75);

      return "[Video duration: " + Math.round(duration) +
        " seconds. Three sampled frames were extracted. " +
        "Visual contact sheet data: " + dataUrl + "]";
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function getVisionImage() {
    const image = attachments.find(item => item.imageData);
    if (image) return image.imageData;

    const video = attachments.find(item => item.video && item.text);
    if (video) {
      const match = video.text.match(/Visual contact sheet data: (data:image\/jpeg;base64,[^)]+)/);
      if (match) return match[1];
    }

    return null;
  }

  function attachmentText() {
    return attachments
      .filter(item => item.text)
      .map(item => `ATTACHMENT: ${item.name}\n${item.text}`)
      .join("\n\n")
      .slice(0, 45000);
  }

  async function searchWeb(query) {
    const response = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Search failed.");
    return data;
  }

  function extractTitle(text) {
    return text.trim().split(/\n/)[0].replace(/\s+/g, " ").slice(0, 34);
  }

  async function send() {
    if (busy) return;

    const raw = $("prompt").value.trim();
    if (!raw && !attachments.length) return;

    if (!navigator.onLine) {
      toast("You're offline. Saved chats still work, but cloud AI does not.");
      return;
    }

    const chat = currentChat();
    if (!chat) return;

    busy = true;
    $("sendButton").disabled = true;
    $("sendButton").textContent = "…";

    const attachedNames = attachments.map(item => item.name);
    let messageText = raw || "Please inspect my attachment.";
    const extracted = attachmentText();

    if (extracted) {
      messageText += "\n\n" + extracted;
    }

    const image = getVisionImage();

    const userMessage = {
      role: "user",
      content: raw || "Please inspect my attachment.",
      createdAt: Date.now(),
      attachmentNames: attachedNames
    };

    chat.messages.push(userMessage);
    setTitleFromMessage(chat, raw || attachedNames[0] || "New conversation");

    $("prompt").value = "";
    autoSize();
    attachments = [];
    renderAll();
    save();

    let searchResults = [];

    try {
      if (searchEnabled) {
        const search = await searchWeb(raw || "information about attached file");
        searchResults = search.results || [];

        if (searchResults.length) {
          chat.messages.push({
            role: "assistant",
            content: "🔎 Web search found " + searchResults.length +
              " result(s). I'll use them in my answer.",
            createdAt: Date.now()
          });
          renderMessages();
        } else {
          toast(search.message || "No search results were found.");
        }
      }

      const messages = chat.messages
        .filter(m => m.role === "user" || m.role === "assistant")
        .slice(-16)
        .map(m => ({ role: m.role, content: m.content }));

      // Put extracted file text into the most recent user message.
      if (extracted && messages.length) {
        messages[messages.length - 1].content += "\n\n" + extracted;
      }

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages,
          image,
          searchResults
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Kage could not respond.");
      }

      const assistantMessage = {
        role: "assistant",
        content: data.reply || "I didn't receive a response.",
        createdAt: Date.now()
      };

      chat.messages.push(assistantMessage);
      save();
      renderAll();

      if (voiceEnabled) speakText(assistantMessage.content);
    } catch (error) {
      chat.messages.push({
        role: "assistant",
        content: "I couldn't finish that request: " + error.message,
        createdAt: Date.now()
      });
      save();
      renderAll();
    } finally {
      busy = false;
      $("sendButton").disabled = false;
      $("sendButton").textContent = "↑";
      $("prompt").focus();
    }
  }

  async function generateImage() {
    const prompt = $("prompt").value.trim();
    if (!prompt) {
      toast("Describe the image first.");
      $("prompt").focus();
      return;
    }

    if (!navigator.onLine) {
      toast("Image generation needs an internet connection.");
      return;
    }

    if (busy) return;
    busy = true;
    $("sendButton").disabled = true;

    const chat = currentChat();
    chat.messages.push({
      role: "user",
      content: "Generate an image: " + prompt,
      createdAt: Date.now()
    });

    $("prompt").value = "";
    autoSize();
    renderAll();

    const loading = {
      role: "assistant",
      content: "Generating your image…",
      createdAt: Date.now()
    };
    chat.messages.push(loading);
    renderAll();

    try {
      const response = await fetch("/api/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      if (!response.ok) {
        let error = "Image generation failed.";
        try {
          const data = await response.json();
          error = data.error || error;
        } catch {}
        throw new Error(error);
      }

      const blob = await response.blob();
      const imageUrl = URL.createObjectURL(blob);

      loading.content = "Image generated.";
      loading.imageUrl = imageUrl;
      save();
      renderAll();
    } catch (error) {
      loading.content = error.message;
      save();
      renderAll();
    } finally {
      busy = false;
      $("sendButton").disabled = false;
    }
  }

  async function speakText(text) {
    if (!text) return;

    if (!navigator.onLine) {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } else {
        toast("Voice playback isn't available in this browser.");
      }
      return;
    }

    try {
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      if (!response.ok) throw new Error("Cloud voice unavailable.");

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);

      audio.onended = () => URL.revokeObjectURL(url);
      await audio.play();
    } catch {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      } else {
        toast("Voice playback failed.");
      }
    }
  }

  function setupSpeechRecognition() {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      toast("Speech input isn't supported in this browser. Try a supported browser.");
      return;
    }

    if (recognition) {
      recognition.stop();
      recognition = null;
      $("micButton").classList.remove("selected");
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = navigator.language || "en-US";
    recognition.continuous = false;
    recognition.interimResults = true;

    let finalText = "";

    recognition.onstart = () => {
      $("micButton").classList.add("selected");
      toast("Listening…");
    };

    recognition.onresult = event => {
      let interim = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const text = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += text;
        else interim += text;
      }

      $("prompt").value = (finalText + " " + interim).trim();
      autoSize();
    };

    recognition.onerror = () => toast("Microphone error. Check browser permissions.");
    recognition.onend = () => {
      $("micButton").classList.remove("selected");
      recognition = null;
      finalText = "";
    };

    recognition.start();
  }

  function startVoiceMode() {
    setupSpeechRecognition();
    toast("Voice mode: speak your message, then press send. Kage can read replies aloud.");
  }

  $("newChat").onclick = () => createChat();
  $("sendButton").onclick = () => imageMode ? generateImage() : send();

  $("prompt").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      imageMode ? generateImage() : send();
    }
  });

  $("prompt").addEventListener("input", autoSize);
  $("attachButton").onclick = () => $("fileInput").click();

  $("fileInput").addEventListener("change", async event => {
    const files = [...event.target.files];

    for (const file of files) {
      try {
        const item = await readFile(file);
        attachments.push(item);
      } catch (error) {
        toast(error.message);
      }
    }

    renderAttachments();
    event.target.value = "";
  });

  $("searchButton").onclick = () => {
    searchEnabled = !searchEnabled;
    $("searchButton").classList.toggle("selected", searchEnabled);
    toast(searchEnabled ? "Web search enabled for the next message." : "Web search disabled.");
  };

  $("imageButton").onclick = () => {
    imageMode = !imageMode;
    $("imageButton").classList.toggle("selected", imageMode);
    $("prompt").placeholder = imageMode
      ? "Describe the image Kage should generate..."
      : "Message Kage...";
    toast(imageMode ? "Image generation mode enabled." : "Chat mode enabled.");
  };

  $("micButton").onclick = setupSpeechRecognition;
  $("voiceMode").onclick = startVoiceMode;

  $("speakToggle").onclick = () => {
    voiceEnabled = !voiceEnabled;
    $("speakToggle").textContent = voiceEnabled ? "🔊 Voice on" : "🔇 Voice off";
    $("speakToggle").classList.toggle("selected", voiceEnabled);
  };

  $("menuButton").onclick = () => $("sidebar").classList.toggle("open");

  $("clearChat").onclick = () => {
    const chat = currentChat();
    if (!chat) return;
    if (!confirm("Delete this conversation?")) return;

    chats = chats.filter(item => item.id !== chat.id);
    activeId = chats[0]?.id || null;
    if (!activeId) createChat(false);
    save();
    renderAll();
  };

  $("exportChats").onclick = () => {
    const blob = new Blob([JSON.stringify(chats, null, 2)], {
      type: "application/json"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kage-chat-backup.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  function updateNetworkStatus() {
    $("networkStatus").textContent = navigator.onLine ? "Online" : "Offline";
    $("subtitle").textContent = navigator.onLine
      ? "Glass workspace · Cloud AI"
      : "Offline shell · Cloud AI unavailable";
  }

  window.addEventListener("online", updateNetworkStatus);
  window.addEventListener("offline", updateNetworkStatus);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  load();
  updateNetworkStatus();
})();
</script>
</body>
</html>
