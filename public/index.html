<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="Kage. An AI that gets it.">
  <title>Kage</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <style>
    :root {
      color-scheme: dark;
      --bg: #030303;
      --bg-deep: #000;
      --glass: rgba(15, 15, 15, .76);
      --glass-strong: rgba(22, 22, 22, .88);
      --glass-light: rgba(255, 255, 255, .035);
      --glass-hover: rgba(255, 255, 255, .065);
      --border: rgba(255, 255, 255, .085);
      --border-light: rgba(255, 255, 255, .13);
      --text: #f8f8f8;
      --muted: #858585;
      --muted-light: #b6b6b6;
      --sidebar-width: 264px;
      --radius: 16px;
      --blur: blur(24px) saturate(115%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-deep);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -30%, #151515 0%, transparent 55%),
        #030303;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 3px;
    }

    ::selection {
      background: #eee;
      color: #000;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #303030;
      border-radius: 99px;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: transparent;
    }

    /* SIDEBAR */

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      padding: 17px 12px 12px;
      background: rgba(7, 7, 7, .86);
      border-right: 1px solid var(--border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      transition: transform .22s ease;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 760;
      letter-spacing: -1px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, .11),
        rgba(255, 255, 255, .015)
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .09),
        0 5px 20px rgba(0, 0, 0, .4);
      color: white;
      font-size: 15px;
      font-weight: 850;
    }

    .icon-btn,
    .plain-btn {
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      color: #c8c8c8;
      transition:
        background .16s ease,
        border-color .16s ease,
        color .16s ease;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }

    .icon-btn:hover,
    .plain-btn:hover {
      background: var(--glass-hover);
      border-color: var(--border);
      color: white;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, .075),
        rgba(255, 255, 255, .018)
      );
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
      text-align: left;
      font-size: 13px;
      font-weight: 620;
      transition: background .16s ease, border-color .16s ease;
    }

    .new-chat:hover {
      background: rgba(255, 255, 255, .085);
      border-color: rgba(255, 255, 255, .2);
    }

    .section-label {
      padding: 24px 10px 10px;
      color: #696969;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      min-width: 0;
      padding: 3px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      border-radius: 10px;
      transition: background .15s ease, border-color .15s ease;
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, .025);
    }

    .chat-item.active {
      background: rgba(255, 255, 255, .065);
      border-color: rgba(255, 255, 255, .075);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
    }

    .chat-select {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding: 9px 8px;
      border: 0;
      background: transparent;
      color: #a9a9a9;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
    }

    .chat-item.active .chat-select {
      color: #f8f8f8;
    }

    .chat-menu {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #888;
      opacity: 0;
      transition: opacity .15s ease, background .15s ease;
    }

    .chat-item:hover .chat-menu,
    .chat-item.active .chat-menu {
      opacity: 1;
    }

    .chat-menu:hover {
      background: rgba(255, 255, 255, .08);
      color: white;
    }

    .sidebar-bottom {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .side-action {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #a4a4a4;
      text-align: left;
      font-size: 12.5px;
      transition: .15s ease;
    }

    .side-action:hover {
      background: var(--glass-hover);
      border-color: var(--border);
      color: white;
    }

    /* MAIN WINDOW */

    .main {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.025), transparent 58%),
        #030303;
    }

    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 62px;
      min-height: 62px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.055);
      background: rgba(3, 3, 3, .68);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .mobile-brand {
      display: none;
    }

    .model-label {
      color: #f0f0f0;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -.2px;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 3px;
      border-radius: 50%;
      background: #aaa;
      box-shadow: 0 0 8px rgba(255, 255, 255, .18);
      vertical-align: middle;
    }

    .top-btn {
      padding: 8px 11px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      background: rgba(255, 255, 255, .035);
      color: #ededed;
      font-size: 11.5px;
      font-weight: 620;
      transition: .15s ease;
    }

    .top-btn:hover {
      background: rgba(255, 255, 255, .085);
      border-color: rgba(255, 255, 255, .2);
    }

    /* CHAT AREA */

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: thin;
    }

    .conversation {
      width: 100%;
      max-width: 820px;
      min-height: 100%;
      margin: 0 auto;
      padding: 36px 25px 34px;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: min(65vh, 610px);
      padding: 35px 0;
      text-align: center;
    }

    .welcome-mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 23px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, .1),
        rgba(255, 255, 255, .018)
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .1),
        0 14px 55px rgba(0, 0, 0, .55);
      color: white;
      font-size: 25px;
      font-weight: 850;
    }

    .welcome h1 {
      margin: 0;
      color: #fafafa;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 650;
      letter-spacing: -1.8px;
    }

    .welcome p {
      margin: 12px 0 29px;
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      width: min(100%, 540px);
    }

    .suggestion {
      min-height: 65px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, .045),
        rgba(255, 255, 255, .012)
      );
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
      color: #d7d7d7;
      text-align: left;
      font-size: 12px;
      line-height: 1.5;
      transition:
        transform .16s ease,
        border-color .16s ease,
        background .16s ease;
    }

    .suggestion:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, .19);
      background: rgba(255, 255, 255, .06);
    }

    .suggestion span {
      display: block;
      margin-bottom: 4px;
      color: #737373;
      font-size: 10.5px;
    }

    /* MESSAGES */

    .message {
      display: flex;
      flex-direction: column;
      min-width: 0;
      margin: 0 0 29px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 9px;
      color: #8a8a8a;
      font-size: 11px;
      font-weight: 650;
    }

    .mini-mark {
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.09),
        rgba(255,255,255,.02)
      );
      color: #fff;
      font-size: 11px;
    }

    .user-bubble {
      max-width: min(88%, 600px);
      padding: 12px 15px;
      border: 1px solid rgba(255,255,255,.105);
      border-radius: 17px 17px 5px 17px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.085),
        rgba(255,255,255,.035)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.045),
        0 8px 25px rgba(0,0,0,.18);
      color: #fafafa;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      font-size: 14px;
    }

    .assistant-content {
      width: 100%;
      color: #e6e6e6;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .assistant-content p {
      margin: 0 0 13px;
    }

    .assistant-content p:last-child {
      margin-bottom: 0;
    }

    .assistant-content h1,
    .assistant-content h2,
    .assistant-content h3 {
      margin: 22px 0 10px;
      color: #fff;
      line-height: 1.35;
      letter-spacing: -.5px;
    }

    .assistant-content h1 { font-size: 22px; }
    .assistant-content h2 { font-size: 19px; }
    .assistant-content h3 { font-size: 16px; }

    .assistant-content ul,
    .assistant-content ol {
      margin: 8px 0 15px;
      padding-left: 24px;
    }

    .assistant-content li {
      margin: 4px 0;
    }

    .assistant-content a {
      color: #f0f0f0;
      text-decoration: underline;
      text-decoration-color: #686868;
      text-underline-offset: 3px;
    }

    .assistant-content a:hover {
      text-decoration-color: #fff;
    }

    .assistant-content blockquote {
      margin: 12px 0;
      padding-left: 14px;
      border-left: 2px solid #777;
      color: #aaa;
    }

    .assistant-content code {
      padding: 2px 5px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 5px;
      background: rgba(255,255,255,.055);
      color: #f2f2f2;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .91em;
    }

    .code-wrap {
      margin: 12px 0 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(7,7,7,.92);
      box-shadow: 0 8px 30px rgba(0,0,0,.24);
    }

    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,.075);
      background: rgba(255,255,255,.025);
      color: #999;
      font-size: 10px;
    }

    .code-head button {
      border: 0;
      background: transparent;
      color: #d0d0d0;
      font-size: 10px;
    }

    .code-head button:hover {
      color: white;
    }

    .code-wrap pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.6;
    }

    .code-wrap pre code {
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 12px;
    }

    .message-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 9px;
      opacity: .76;
    }

    .message-actions button {
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #8b8b8b;
      font-size: 10.5px;
      transition: .15s ease;
    }

    .message-actions button:hover {
      border-color: var(--border);
      background: var(--glass-hover);
      color: white;
    }

    /* SEARCH SOURCES */

    .sources {
      width: 100%;
      margin-top: 15px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
    }

    .sources-title {
      margin-bottom: 8px;
      color: #999;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .source-link {
      display: block;
      margin-top: 5px;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 9px;
      background: rgba(255,255,255,.025);
      color: #e5e5e5 !important;
      text-decoration: none !important;
      font-size: 11px;
      line-height: 1.5;
      transition: background .15s ease, border-color .15s ease;
    }

    .source-link:hover {
      border-color: rgba(255,255,255,.17);
      background: rgba(255,255,255,.055);
    }

    .source-url {
      display: block;
      overflow-wrap: anywhere;
      color: #737373;
      font-size: 10px;
    }

    /* THINKING INDICATOR */

    .typing {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      color: #929292;
      font-size: 12px;
    }

    .typing-dots {
      display: flex;
      gap: 3px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d5d5d5;
      animation: pulse 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes pulse {
      0%, 70%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* COMPOSER */

    .composer-area {
      position: relative;
      z-index: 4;
      padding: 12px 20px 15px;
      background: linear-gradient(
        to bottom,
        rgba(3,3,3,0),
        rgba(3,3,3,.92) 20%,
        #030303 100%
      );
    }

    .composer {
      max-width: 820px;
      margin: 0 auto;
      padding: 10px 11px 9px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      background: rgba(16,16,16,.76);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 14px 55px rgba(0,0,0,.4);
      backdrop-filter: blur(28px) saturate(120%);
      -webkit-backdrop-filter: blur(28px) saturate(120%);
      transition: border-color .18s ease, background .18s ease;
    }

    .composer:focus-within {
      border-color: rgba(255,255,255,.23);
      background: rgba(19,19,19,.86);
    }

    .attachment-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 0 2px 9px;
    }

    .attachment-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,.045);
      color: #d0d0d0;
      font-size: 10.5px;
    }

    .attachment-chip span {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-chip button {
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: #aaa;
    }

    #messageInput {
      display: block;
      width: 100%;
      min-height: 28px;
      max-height: 200px;
      padding: 5px 5px 9px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 14px;
      line-height: 1.6;
    }

    #messageInput::placeholder {
      color: #737373;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .composer-tools,
    .composer-submit {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #aaa;
      font-size: 17px;
      transition: .15s ease;
    }

    .tool-btn:hover {
      border-color: var(--border);
      background: rgba(255,255,255,.06);
      color: white;
    }

    .search-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: auto;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.1);
      font-size: 10.5px;
    }

    .search-toggle.on {
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.1);
      color: white;
    }

    .send-btn {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 11px;
      background: #f5f5f5;
      color: #050505;
      font-size: 17px;
      font-weight: 850;
      transition: transform .15s ease, background .15s ease;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      background: white;
    }

    .send-btn.stop {
      border-color: #555;
      background: #252525;
      color: white;
    }

    .disclaimer {
      max-width: 820px;
      margin: 8px auto 0;
      color: #555;
      text-align: center;
      font-size: 10px;
      line-height: 1.5;
    }

    /* MODALS */

    .overlay {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      width: min(100%, 440px);
      max-height: 85dvh;
      overflow-y: auto;
      padding: 21px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(13,13,13,.88);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.065),
        0 25px 100px rgba(0,0,0,.75);

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "kage-chats-v4";
  const ACTIVE_KEY = "kage-active-v4";

  let chats = [];
  let activeId = null;
  let busy = false;
  let abortController = null;
  let searchEnabled = true;
  let attachments = [];
  let deferredInstallPrompt = null;
  let renameId = null;
  let toastTimer = null;

  function uid() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function safeURL(raw) {
    try {
      const url = new URL(raw);
      return ["https:", "http:"].includes(url.protocol) ? url.href : "";
    } catch {
      return "";
    }
  }

  function showToast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      $("toast").classList.remove("show");
    }, 2300);
  }

  function currentChat() {
    return chats.find(chat => chat.id === activeId);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
      localStorage.setItem(ACTIVE_KEY, activeId || "");
    } catch {
      showToast("storage is full. export your chats to keep a backup.");
    }
  }

  function normalizeChat(chat) {
    return {
      id: String(chat.id || uid()),
      title: String(chat.title || "New Chat").slice(0, 60),
      createdAt: Number(chat.createdAt || Date.now()),
      updatedAt: Number(chat.updatedAt || Date.now()),
      messages: Array.isArray(chat.messages)
        ? chat.messages
            .filter(message =>
              message &&
              ["user", "assistant"].includes(message.role)
            )
            .map(message => ({
              id: String(message.id || uid()),
              role: message.role,
              content: String(message.content || ""),
              sources: Array.isArray(message.sources) ? message.sources : [],
              attachments: Array.isArray(message.attachments)
                ? message.attachments
                : []
            }))
        : []
    };
  }

  function load() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      chats = Array.isArray(parsed) ? parsed.map(normalizeChat) : [];
    } catch {
      chats = [];
    }

    activeId = localStorage.getItem(ACTIVE_KEY);

    if (!chats.some(chat => chat.id === activeId)) {
      activeId = null;
    }

    if (!chats.length) createChat(false);
    if (!activeId) activeId = chats[0]?.id || null;

    save();
    renderAll();
  }

  function createChat(shouldRender = true) {
    const chat = {
      id: uid(),
      title: "New Chat",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      messages: []
    };

    chats.unshift(chat);
    activeId = chat.id;
    save();

    if (shouldRender) {
      renderAll();
      $("messageInput").focus();
      closeSidebar();
    }

    return chat;
  }

  function newChat() {
    if (busy) stopGeneration();
    createChat(true);
  }

  function renderSidebar() {
    const list = $("chatList");
    list.replaceChildren();

    [...chats]
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .forEach(chat => {
        const row = document.createElement("div");
        row.className = "chat-item" + (chat.id === activeId ? " active" : "");

        const select = document.createElement("button");
        select.className = "chat-select";
        select.textContent = chat.title || "New Chat";
        select.title = "open chat";

        select.addEventListener("click", () => {
          if (busy) stopGeneration();
          activeId = chat.id;
          save();
          renderAll();
          closeSidebar();
        });

        const menu = document.createElement("button");
        menu.className = "chat-menu";
        menu.textContent = "···";
        menu.title = "chat options";
        menu.setAttribute("aria-label", "chat options");
        menu.addEventListener("click", () => showChatMenu(chat.id));

        row.append(select, menu);
        list.append(row);
      });
  }

  function showChatMenu(id) {
    const choice = prompt("type: rename or delete");
    if (!choice) return;

    if (choice.toLowerCase().startsWith("ren")) {
      renameId = id;
      const chat = chats.find(item => item.id === id);

      $("renameInput").value = chat?.title || "";
      $("renameModal").classList.add("open");
      $("renameInput").focus();
    } else if (choice.toLowerCase().startsWith("del")) {
      const chat = chats.find(item => item.id === id);
      if (!chat) return;

      if (!confirm(`delete "${chat.title}"? this can't be undone.`)) return;

      chats = chats.filter(item => item.id !== id);

      if (activeId === id) {
        activeId = chats[0]?.id || null;
      }

      if (!chats.length) createChat(false);

      save();
      renderAll();
    }
  }

  function renderAll() {
    renderSidebar();
    renderConversation();
  }

  function renderConversation() {
    const host = $("conversation");
    host.replaceChildren();

    const chat = currentChat();

    if (!chat || !chat.messages.length) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";

      welcome.innerHTML = `
        <div class="welcome-mark">K</div>
        <h1>what's on your mind?</h1>
        <p>no complicated setup. just talk.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="explain something i'm learning in a simple way">
            <span>learn</span>
            explain something i'm learning
          </button>
          <button class="suggestion" data-prompt="help me come up with a genuinely good idea">
            <span>create</span>
            help me build something cool
          </button>
          <button class="suggestion" data-prompt="search the web for the latest important tech news and give me sources">
            <span>research</span>
            find what's happening right now
          </button>
          <button class="suggestion" data-prompt="help me solve this problem step by step">
            <span>solve</span>
            work through a problem with me
          </button>
        </div>
      `;

      welcome.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          $("messageInput").value = button.dataset.prompt;
          autoResize();
          $("composer").requestSubmit();
        });
      });

      host.append(welcome);
      return;
    }

    chat.messages.forEach((message, index) => {
      host.append(makeMessageElement(message, index));
    });

    scrollToBottom();
  }

  function renderContent(text) {
    const codeBlocks = [];

    let input = String(text || "").replace(/\r\n/g, "\n");

    input = input.replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
      codeBlocks.push({ lang: lang || "code", code });
      return `\u0000${codeBlocks.length - 1}\u0000`;
    });

    let html = escapeHTML(input);

    html = html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (_, label, rawURL) => {
        const url = safeURL(rawURL);
        return url
          ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`
          : label;
      }
    );

    html = html
      .replace(/^### (.+)$/gm, "<h3>$1</h3>")
      .replace(/^## (.+)$/gm, "<h2>$1</h2>")
      .replace(/^# (.+)$/gm, "<h1>$1</h1>")
      .replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
      .replace(/`([^`\n]+)`/g, "<code>$1</code>");

    html = html.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, (match, prefix, rawURL) => {
      const cleaned = rawURL.replace(/[.,!?;:]$/, "");
      const url = safeURL(cleaned);

      return url
        ? `${prefix}<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(cleaned)}</a>${rawURL.slice(cleaned.length)}`
        : match;
    });

    const lines = html.split("\n");
    let output = "";
    let paragraph = [];
    let list = null;

    function closeParagraph() {
      if (paragraph.length) {
        output += `<p>${paragraph.join("<br>")}</p>`;
        paragraph = [];
      }
    }

    function closeList() {
      if (list) {
        output += `</${list}>`;
        list = null;
      }
    }

    for (const line of lines) {
      const marker = line.match(/^\u0000(\d+)\u0000$/);

      if (marker) {
        closeParagraph();
        closeList();

        const block = codeBlocks[Number(marker[1])];

        output += `
          <div class="code-wrap">
            <div class="code-head">
              <span>${escapeHTML(block.lang)}</span>
              <button type="button" data-code="${Number(marker[1])}">copy code</button>
            </div>
            <pre><code>${escapeHTML(block.code)}</code></pre>
          </div>
        `;

        continue;
      }

      const unordered = line.match(/^\s*[-*]\s+(.+)/);
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)/);
      const heading = /^<h[1-3]>/.test(line);
      const quote = /^<blockquote>/.test(line);

      if (unordered || ordered) {
        closeParagraph();

        const nextList = unordered ? "ul" : "ol";

        if (list !== nextList) {
          closeList();
          output += `<${nextList}>`;
          list = nextList;
        }

        output += `<li>${(unordered || ordered)[1]}</li>`;
      } else {
        closeList();

        if (!line.trim()) {
          closeParagraph();
        } else if (heading || quote) {
          closeParagraph();
          output += line;
        } else {
          paragraph.push(line);
        }
      }
    }

    closeParagraph();
    closeList();

    return output;
  }

  function makeMessageElement(message, index) {
    const wrap = document.createElement("article");
    wrap.className = `message ${message.role}`;
    wrap.dataset.messageId = message.id;

    if (message.role === "user") {
      const bubble = document.createElement("div");
      bubble.className = "user-bubble";
      bubble.textContent = message.content;

      if (message.attachments?.length) {
        const files = document.createElement("div");
        files.style.cssText = "font-size:10px;color:#aaa;margin-top:7px";
        files.textContent = "attached: " +
          message.attachments.map(file => file.name).join(", ");
        bubble.append(files);
      }

      wrap.append(bubble);

      const actions = document.createElement("div");
      actions.className = "message-actions";
      actions.innerHTML = `
        <button data-action="edit">edit</button>
        <button data-action="copy">copy</button>
      `;

      actions.querySelector('[data-action="edit"]')
        .addEventListener("click", () => editMessage(message.id));

      actions.querySelector('[data-action="copy"]')
        .addEventListener("click", () => copyText(message.content));

      wrap.append(actions);
    } else {
      const head = document.createElement("div");
      head.className = "message-head";
      head.innerHTML = `<span class="mini-mark">K</span><span>kage</span>`;

      const content = document.createElement("div");
      content.className = "assistant-content";
      content.innerHTML = renderContent(message.content);

      content.querySelectorAll("[data-code]").forEach(button => {
        button.addEventListener("click", () => {
          const blocks = message.content.match(/```[\w+-]*\n[\s\S]*?```/g) || [];
          const block = blocks[Number(button.dataset.code)] || "";
          copyText(block.replace(/^```[\w+-]*\n/, "").replace(/```$/, ""));
        });
      });

      wrap.append(head, content);

      if (message.sources?.length) {
        const sources = document.createElement("div");
        sources.className = "sources";
        sources.innerHTML = `<div class="sources-title">sources</div>`;

        message.sources.slice(0, 5).forEach(source => {
          const url = safeURL(source.url);
          if (!url) return;

          const link = document.createElement("a");
          link.className = "source-link";
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source.title || url;

          const small = document.createElement("span");
          small.className = "source-url";
          small.textContent = url;

          link.append(small);
          sources.append(link);
        });

        wrap.append(sources);
      }

      const actions = document.createElement("div");
      actions.className = "message-actions";
      actions.innerHTML = `
        <button data-action="copy">copy</button>
        <button data-action="regenerate">regenerate</button>
      `;

      actions.querySelector('[data-action="copy"]')
        .addEventListener("click", () => copyText(message.content));

      actions.querySelector('[data-action="regenerate"]')
        .addEventListener("click", () => regenerateFrom(index));

      wrap.append(actions);
    }

    return wrap;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
    });
  }

  function autoResize() {
    const input = $("messageInput");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  function closeSidebar() {
    $("sidebar").classList.remove("open");
    $("mobileBackdrop").classList.remove("open");
  }

  function openSidebar() {
    $("sidebar").classList.add("open");
    $("mobileBackdrop").classList.add("open");
  }

  function editMessage(messageId) {
    if (busy) return;

    const chat = currentChat();
    const index = chat?.messages.findIndex(message => message.id === messageId) ?? -1;

    if (index < 0 || chat.messages[index].role !== "user") return;

    $("messageInput").value = chat.messages[index].content;
    attachments = [];
    renderAttachments();

    chat.messages = chat.messages.slice(0, index);

    save();
    renderConversation();
    autoResize();

    $("messageInput").focus();
    $("messageInput").dataset.editing = "true";
  }

  async function regenerateFrom(index) {
    if (busy) return;

    const chat = currentChat();
    if (!chat || index < 0) return;

    let userIndex = -1;

    for (let i = index - 1; i >= 0; i--) {
      if (chat.messages[i].role === "user") {
        userIndex = i;
        break;
      }
    }

    if (userIndex < 0) return;

    chat.messages = chat.messages.slice(0, userIndex + 1);
    save();
    renderConversation();

    await requestAssistant();
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(String(text || ""));
      showToast("copied");
    } catch {
      const area = document.createElement("textarea");
      area.value = String(text || "");
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      showToast("copied");
    }
  }

  function renderAttachments() {
    const host = $("attachmentPreview");
    host.replaceChildren();

    attachments.forEach((file, index) => {
      const chip = document.createElement("div");
      chip.className = "attachment-chip";

      const name = document.createElement("span");
      name.textContent = file.name;

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "remove attachment");

      remove.addEventListener("click", () => {
        attachments.splice(index, 1);
        renderAttachments();
      });

      chip.append(name, remove);
      host.append(chip);
    });
  }

  async function addFiles(fileList) {
    const files = [...fileList];

    for (const file of files) {
      if (file.size > 4 * 1024 * 1024) {
        showToast(`${file.name} is over 4 mb`);
        continue;
      }

      if (attachments.length >= 4) {
        showToast("up to 4 files per message");
        break;
      }

      const item = {
        name: file.name,
        type: file.type || "application/octet-stream",
        text: "",
        dataUrl: ""
      };

      if (file.type.startsWith("image/")) {
        item.dataUrl = await readAsDataURL(file);
      } else if (
        /^(text\/|application\/json|application\/javascript)/.test(file.type) ||
        /\.(txt|md|csv|json|js|ts|html|css|py|xml|yaml|yml|log)$/i.test(file.name)
      ) {
        item.text = (await file.text()).slice(0, 60000);
      } else {
        showToast(`${file.name}: this file type isn't readable here`);
        continue;
      }

      attachments.push(item);
    }

    renderAttachments();
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function getHistoryForAPI(chat) {
    return chat.messages.map(message => ({
      role: message.role,
      content: message.content
    }));
  }

  function showTyping() {
    const host = $("conversation");
    const element = document.createElement("article");

    element.className = "message assistant";
    element.id = "typingIndicator";

    element.innerHTML = `
      <div class="message-head">
        <span class="mini-mark">K</span>
        <span>kage</span>
      </div>
      <div class="typing">
        <span>thinking</span>
        <span class="typing-dots">
          <span></span><span></span><span></span>
        </span>
      </div>
    `;

    host.append(element);
    scrollToBottom();
  }

  function setBusy(value) {
    busy = value;

    $("sendBtn").textContent = value ? "■" : "↑";
    $("sendBtn").classList.toggle("stop", value);
    $("sendBtn").setAttribute(
      "aria-label",
      value ? "stop response" : "send message"
    );

    $("messageInput").disabled = false;
    $("attachBtn").disabled = value;
    $("micBtn").disabled = value;
  }

  function stopGeneration() {
    if (abortController) abortController.abort();

    abortController = null;
    busy = false;
    setBusy(false);

    $("typingIndicator")?.remove();

    const chat = currentChat();
    const last = chat?.messages[chat.messages.length - 1];

    if (last?.role === "assistant" && !last.content) {
      chat.messages.pop();
    }

    save();
    renderConversation();
  }

  async function submitMessage(event) {
    event?.preventDefault();

    if (busy) {
      stopGeneration();
      return;
    }

    const text = $("messageInput").value.trim();

    if (!text && !attachments.length) return;

    const chat = currentChat() || createChat(false);
    const messageAttachments = attachments.map(file => ({
      name: file.name,
      type: file.type,
      text: file.text,
      dataUrl: file.dataUrl
    }));

    const attachmentText = messageAttachments
      .filter(file => file.text)
      .map(file => `\n\n[file: ${file.name}]\n${file.text}`)
      .join("");

    const messageText =
      (text || "please look at the attached file(s).") + attachmentText;

    chat.messages.push({
      id: uid(),
      role: "user",
      content: messageText,
      attachments: messageAttachments.map(file => ({
        name: file.name,
        type: file.type
      }))
    });

    chat.updatedAt = Date.now();

    $("messageInput").value = "";
    delete $("messageInput").dataset.editing;
    autoResize();

    attachments = [];
    renderAttachments();

    save();
    renderAll();

    await updateTitleIfNeeded(chat);
    await requestAssistant(messageAttachments);
  }

  async function requestAssistant(messageAttachments = []) {
    const chat = currentChat();
    if (!chat) return;

    abortController = new AbortController();
    setBusy(true);
    showTyping();

    const assistant = {
      id: uid(),
      role: "assistant",
      content: "",
      sources: []
    };

    chat.messages.push(assistant);
    save();

    try {
      const payload = {
        messages: getHistoryForAPI(chat).slice(0, -1),
        search: searchEnabled,
        attachments: messageAttachments.map(file => ({
          name: file.name,
          type: file.type,
          text: file.text,
          dataUrl: file.dataUrl
        }))
      };

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: abortController.signal
      });

      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || `request failed (${response.status})`);
      }

      $("typingIndicator")?.remove();

      const contentType = response.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        const data = await response.json();
        assistant.content = data.response || data.error || "i couldn't get a response.";
        assistant.sources = Array.isArray(data.sources) ? data.sources : [];
      } else if (response.body) {
        await readResponseStream(response.body, assistant);
      } else {
        assistant.content = await response.text();
      }

      if (!assistant.content.trim()) {
        assistant.content = "the response came back empty. try again.";
      }
    } catch (error) {
      $("typingIndicator")?.remove();

      if (error.name === "AbortError") {
        if (!assistant.content) {
          chat.messages = chat.messages.filter(message => message.id !== assistant.id);
        }
      } else {
        assistant.content = assistant.content ||
          `i hit a server issue: ${error.message}. check the worker logs, then try again.`;
      }
    } finally {
      abortController = null;
      setBusy(false);

      chat.updatedAt = Date.now();
      save();
      renderAll();

      updateTitleIfNeeded(chat);
    }
  }

  async function readResponseStream(stream, assistant) {
    const reader = stream.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;

        const raw = line.slice(5).trim();

        if (!raw || raw === "[DONE]") continue;

        try {
          const data = JSON.parse(raw);

          if (typeof data.response === "string") {
            assistant.content += data.response;
          } else if (typeof data.delta?.content === "string") {
            assistant.content += data.delta.content;
          } else if (typeof data.text === "string") {
            assistant.content += data.text;
          } else if (data.error) {
            throw new Error(data.error);
          }
        } catch (error) {
          if (error instanceof SyntaxError) continue;
          throw error;
        }

        const node = document.querySelector(
          `[data-message-id="${CSS.escape(assistant.id)}"] .assistant-content`
        );

        if (node) {
          node.innerHTML = renderContent(assistant.content);
        } else {
          $("typingIndicator")?.remove();
          renderConversation();
        }

        scrollToBottom();
      }
    }

    const finalText = buffer.trim();

    if (finalText.startsWith("data:")) {
      const raw = finalText.slice(5).trim();

      if (raw && raw !== "[DONE]") {
        try {
          const data = JSON.parse(raw);

          if (typeof data.response === "string") {
            assistant.content += data.response;
          } else if (typeof data.delta?.content === "string") {
            assistant.content += data.delta.content;
          } else if (typeof data.text === "string") {
            assistant.content += data.text;
          }
        } catch {
          // Ignore an incomplete final streaming chunk.
        }
      }
    } else if (finalText) {
      assistant.content += finalText;
    }
  }

  async function updateTitleIfNeeded(chat) {
    if (!chat || !chat.messages.some(message => message.role === "user")) {
      return;
    }

    const shouldUpdate =
      chat.title === "New Chat" ||
      chat.messages.filter(message => message.role === "user").length <= 4;

    if (!shouldUpdate) return;

    try {
      const response = await fetch("/api/title", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: getHistoryForAPI(chat) })
      });

      if (!response.ok) return;

      const data = await response.json();
      const title = cleanTitle(data.title);

      if (title) {
        chat.title = title;
        chat.updatedAt = Date.now();
        save();
        renderSidebar();
      }
    } catch {
      const last = [...chat.messages]
        .reverse()
        .find(message => message.role === "user");

      if (last && chat.title === "New Chat") {
        chat.title = fallbackTitle(last.content);
        save();
        renderSidebar();
      }
    }
  }

  function cleanTitle(title) {
    const words = String(title || "")
      .replace(/["'`]/g, "")
      .trim()
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 3);

    return words.length >= 2
      ? words.map(word => word[0].toUpperCase() + word.slice(1)).join(" ")
      : "";
  }

  function fallbackTitle(text) {
    const ignored = new Set([
      "the", "and", "for", "that", "this", "with", "what", "how",
      "can", "you", "please", "make", "help", "me", "it", "just",
      "want", "need", "about", "a", "an", "to", "is", "are", "my", "i", "do"
    ]);

    const words = String(text || "")
      .replace(/https?:\/\/\S+/g, "")
      .replace(/[^\p{L}\p{N}' -]/gu, " ")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    const useful = words.filter(word => !ignored.has(word.toLowerCase()));
    const selected = (useful.length >= 2 ? useful : words).slice(0, 3);

    if (selected.length === 1) selected.push("Chat");

    return selected
      .map(word => word[0].toUpperCase() + word.slice(1))
      .join(" ") || "New Chat";
  }

  function exportChat(chat) {
    if (!chat) return;

    const blob = new Blob(
      [JSON.stringify(chat, null, 2)],
      { type: "application/json" }
    );

    downloadBlob(blob, `${safeFilename(chat.title || "kage-chat")}.json`);
  }

  function exportAll() {
    const blob = new Blob(
      [JSON.stringify(chats, null, 2)],
      { type: "application/json" }
    );

    downloadBlob(blob, "kage-conversations.json");
    closeSidebar();
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.append(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function safeFilename(value) {
    return String(value)
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 45) || "kage-chat";
  }

  function openModal(id) {
    $(id).classList.add("open");
  }

  function closeModal(id) {
    $(id).classList.remove("open");
  }

  function showInstallInstructions(device) {
    const instructions = {
      iphone: "open this deployed kage site in safari. tap the share button, choose “add to home screen,” then tap add. the home-screen icon opens kage like an app.",
      ipad: "open kage in safari. tap share, choose “add to home screen,” and confirm. if the option is hidden, check the share-sheet actions.",
      android: "open kage in chrome. open the browser menu and choose “install app” or “add to home screen” if offered.",
      tablet: "open kage in chrome. use the browser menu and choose “install app” or “add to home screen” if offered.",
      windows: "open kage in edge or chrome. use the install-app icon in the address bar or the browser menu’s “install this site as an app” option when available.",
      laptop: "open kage in a supported browser. use its install-app option if available. otherwise, bookmark the site or create a browser shortcut."
    };

    $("installOptions").hidden = true;
    $("installInstructions").hidden = false;
    $("installInstructionsText").textContent =
      instructions[device] || "open kage in your browser and use its install option if available.";

    $("installPwa").hidden = !deferredInstallPrompt;
    $("installPwa").textContent = "install kage";
  }

  $("newChat").addEventListener("click", newChat);
  $("openSidebar").addEventListener("click", openSidebar);
  $("closeSidebar").addEventListener("click", closeSidebar);
  $("mobileBackdrop").addEventListener("click", closeSidebar);
  $("composer").addEventListener("submit", submitMessage);
  $("messageInput").addEventListener("input", autoResize);

  $("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("composer").requestSubmit();
    }
  });

  $("sendBtn").addEventListener("click", event => {
    if (busy) {
      event.preventDefault();
      stopGeneration();
    }
  });

  $("attachBtn").addEventListener("click", () => {
    $("fileInput").click();
  });

  $("fileInput").addEventListener("change", async event => {
    await addFiles(event.target.files);
    event.target.value = "";
  });

  $("searchToggle").addEventListener("click", () => {
    searchEnabled = !searchEnabled;

    $("searchToggle").classList.toggle("on", searchEnabled);
    $("searchToggle").setAttribute("aria-pressed", String(searchEnabled));
    $("searchToggle").title = searchEnabled
      ? "automatic live web search on"
      : "automatic live web search off";

    showToast(searchEnabled ? "live search on" : "live search off");
  });

  $("installOpen").addEventListener("click", () => {
    $("installOptions").hidden = false;
    $("installInstructions").hidden = true;
    openModal("installModal");
    closeSidebar();
  });

  $("installTop").addEventListener("click", () => {
    $("installOptions").hidden = false;
    $("installInstructions").hidden = true;
    openModal("installModal");
  });

  $("installOptions").querySelectorAll("[data-device]").forEach(button => {
    button.addEventListener("click", () => {
      showInstallInstructions(button.dataset.device);
    });
  });

  $("backToDevices").addEventListener("click", () => {
    $("installOptions").hidden = false;
    $("installInstructions").hidden = true;
  });

  $("installPwa").addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;

    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;

    deferredInstallPrompt = null;
    $("installPwa").hidden = true;

    showToast("install prompt closed");
  });

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredInstallPrompt = event;
  });

  document.querySelectorAll("[data-close]").forEach(button => {
    button.addEventListener("click", () => {
      closeModal(button.dataset.close);
    });
  });

  document.querySelectorAll(".overlay").forEach(overlay => {
    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        overlay.classList.remove("open");
      }
    });
  });

  $("renameForm").addEventListener("submit", event => {
    event.preventDefault();

    const chat = chats.find(item => item.id === renameId);
    const title = cleanTitle($("renameInput").value);

    if (chat && title) {
      chat.title = title;
      chat.updatedAt = Date.now();

      save();
      renderSidebar();
      closeModal("renameModal");
    } else {
      showToast("use a title with 2–3 words");
    }
  });

  $("exportCurrent").addEventListener("click", () => {
    exportChat(currentChat());
  });

  $("exportAll").addEventListener("click", exportAll);

  let recognition = null;

  $("micBtn").addEventListener("click", () => {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      showToast("voice input isn't supported in this browser");
      return;
    }

    if (recognition) {
      recognition.stop();
      recognition = null;
      $("micBtn").style.color = "";
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = navigator.language || "en-US";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = event => {
      let text = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
      }

      $("messageInput").value = text;
      autoResize();
    };

    recognition.onend = () => {
      recognition = null;
      $("micBtn").style.color = "";
    };

    recognition.onerror = () => {
      showToast("couldn't hear that. try again.");
    };

    recognition.start();
    $("micBtn").style.color = "#fff";
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  load();
})();
</script>
</body>
</html>
