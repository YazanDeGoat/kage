<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Kage AI">
  <title>Kage AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #0b0b0b;
      --panel-hover: #171717;
      --border: #242424;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #fff;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 2px solid #777;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #080808;
      border-right: 1px solid var(--border);
      transition: transform 0.2s ease;
      z-index: 20;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 14px;
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #ccc;
      font-size: 17px;
    }

    .icon-btn:hover {
      background: #191919;
      border-color: #292929;
      color: white;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 10px 15px;
      padding: 11px 12px;
      border: 1px solid #292929;
      border-radius: 11px;
      background: #101010;
      text-align: left;
      font-size: 13px;
    }

    .new-chat:hover {
      background: #191919;
    }

    .section-label {
      padding: 8px 16px;
      color: #777;
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 2px 0;
      padding: 3px;
      border-radius: 9px;
    }

    .chat-item.active {
      background: #1b1b1b;
    }

    .chat-item:hover {
      background: #141414;
    }

    .chat-select {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: #ccc;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
    }

    .chat-item.active .chat-select {
      color: #fff;
    }

    .chat-menu-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #888;
    }

    .chat-menu-btn:hover {
      background: #292929;
      color: white;
    }

    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .download-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      border: 1px solid #303030;
      border-radius: 10px;
      background: #151515;
      font-size: 13px;
    }

    .download-button:hover {
      background: #222;
    }

    .download-menu {
      display: none;
      margin-top: 8px;
      padding: 6px;
      border: 1px solid #292929;
      border-radius: 11px;
      background: #101010;
    }

    .download-menu.open {
      display: block;
    }

    .download-option {
      display: block;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      font-size: 12px;
    }

    .download-option:hover {
      background: #222;
    }

    .download-note {
      padding: 8px 10px 5px;
      color: #888;
      font-size: 10px;
      line-height: 1.5;
    }

    .main {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px 18px;
      border-bottom: 1px solid #171717;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-title {
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }

    .conversation {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .messages {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    .welcome {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 45px 20px 20px;
    }

    .welcome-logo {
      margin-bottom: 14px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .welcome-subtitle {
      margin-bottom: 28px;
      color: #999;
      font-size: 14px;
      text-align: center;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, 530px);
    }

    .suggestion {
      min-height: 70px;
      padding: 13px;
      border: 1px solid #252525;
      border-radius: 12px;
      background: #080808;
      color: #ddd;
      text-align: left;
      font-size: 12px;
      line-height: 1.5;
    }

    .suggestion:hover {
      background: #141414;
      border-color: #3a3a3a;
    }

    .message {
      display: flex;
      flex-direction: column;
      margin-bottom: 27px;
      min-width: 0;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-content {
      max-width: 100%;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.75;
    }

    .message.user .message-content {
      max-width: min(85%, 590px);
      padding: 11px 15px;
      border: 1px solid #262626;
      border-radius: 17px 17px 5px 17px;
      background: #171717;
      white-space: pre-wrap;
    }

    .message.assistant .message-content {
      width: 100%;
    }

    .message-content p {
      margin: 0 0 13px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      margin: 20px 0 9px;
      line-height: 1.35;
    }

    .message-content h1 {
      font-size: 23px;
    }

    .message-content h2 {
      font-size: 19px;
    }

    .message-content h3 {
      font-size: 16px;
    }

    .message-content ul,
    .message-content ol {
      padding-left: 24px;
    }

    .message-content li {
      margin: 5px 0;
    }

    .message-content a {
      color: #c8dcff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .message-content blockquote {
      margin: 12px 0;
      padding: 4px 0 4px 14px;
      border-left: 3px solid #555;
      color: #bbb;
    }

    .message-content code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #202020;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9em;
    }

    .code-wrap {
      width: 100%;
      margin: 12px 0;
      overflow: hidden;
      border: 1px solid #303030;
      border-radius: 10px;
      background: #090909;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #242424;
      color: #aaa;
      font-size: 11px;
    }

    .code-header button {
      padding: 4px 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #171717;
      font-size: 11px;
    }

    .code-wrap pre {
      max-width: 100%;
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.55;
    }

    .code-wrap pre code {
      padding: 0;
      background: transparent;
      font-size: 12px;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 8px;
      opacity: 0.7;
    }

    .message-actions button {
      padding: 5px 7px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #999;
      font-size: 11px;
    }

    .message-actions button:hover {
      background: #191919;
      color: white;
    }

    .message-error {
      color: #ff9292;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 0;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #888;
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .composer-area {
      width: 100%;
      padding: 10px 20px 15px;
      background: linear-gradient(to bottom, transparent, #000 18%);
    }

    .composer {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid #303030;
      border-radius: 18px;
      background: #101010;
      box-shadow: 0 8px 35px #0008;
    }

    .attachment-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 10px 12px 0;
    }

    .attachment-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 220px;
      padding: 6px 9px;
      border: 1px solid #303030;
      border-radius: 8px;
      background: #191919;
      color: #ccc;
      font-size: 11px;
    }

    .attachment-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-chip button {
      border: 0;
      background: transparent;
      color: #aaa;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 52px;
      max-height: 200px;
      padding: 15px 15px 8px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f5f5f5;
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: #777;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px 9px;
    }

    .composer-tools,
    .composer-send-tools {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 35px;
      height: 35px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #aaa;
      font-size: 17px;
    }

    .tool-btn:hover {
      background: #242424;
      color: white;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: #f5f5f5;
      color: #000;
      font-size: 17px;
      font-weight: 800;
    }

    .send-btn:hover {
      background: #ddd;
    }

    .send-btn.stop {
      background: #333;
      color: white;
    }

    .disclaimer {
      margin: 9px auto 0;
      color: #666;
      font-size: 10px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: 24px;
      left: 50%;
      max-width: calc(100vw - 30px);
      padding: 10px 15px;
      transform: translateX(-50%);
      border: 1px solid #333;
      border-radius: 10px;
      background: #181818;
      color: #eee;
      font-size: 12px;
      box-shadow: 0 8px 30px #0009;
    }

    .toast[hidden] {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000b;
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(100%, 380px);
      padding: 20px;
      border: 1px solid #303030;
      border-radius: 15px;
      background: #101010;
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .modal input {
      width: 100%;
      padding: 11px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #050505;
      color: white;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #191919;
      font-size: 12px;
    }

    .modal-actions .primary {
      background: white;
      color: black;
    }

    .mobile-backdrop {
      display: none;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(85vw, 290px);
        min-width: 0;
        transform: translateX(-105%);
        box-shadow: none;
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 40px #0009;
      }

      .mobile-backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 15;
        background: #0009;
      }

      .topbar {
        min-height: 54px;
        padding: 8px 10px;
      }

      .messages {
        padding: 22px 15px 30px;
      }

      .welcome {
        padding-top: 30px;
      }

      .welcome-logo {
        font-size: 34px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .suggestion {
        min-height: 55px;
      }

      .composer-area {
        padding: 8px 9px max(10px, env(safe-area-inset-bottom));
      }

      .message.user .message-content {
        max-width: 92%;
      }

      .composer textarea {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">kage</div>
        <div class="sidebar-actions">
          <button class="icon-btn" id="newChatTop" title="New chat" aria-label="New chat">＋</button>
          <button class="icon-btn" id="closeSidebar" title="Close sidebar" aria-label="Close sidebar">×</button>
        </div>
      </div>

      <button class="new-chat" id="newChat">
        <span>＋</span>
        <span>new chat</span>
      </button>

      <div class="section-label">your chats</div>
      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-bottom">
        <button class="download-button" id="downloadButton" aria-expanded="false">
          <span>↓</span>
          <span>download kage</span>
        </button>

        <div class="download-menu" id="downloadMenu">
          <button class="download-option" data-device="iPhone">📱 iPhone</button>
          <button class="download-option" data-device="iPad">▣ iPad</button>
          <button class="download-option" data-device="Android phone">📱 Android phone</button>
          <button class="download-option" data-device="Android tablet">▣ Android / Samsung tablet</button>
          <button class="download-option" data-device="Windows computer">🖥️ Windows computer</button>
          <button class="download-option" data-device="Windows laptop">💻 Windows laptop</button>
          <div class="download-note">
            install options depend on your browser and device. this installs the web app when supported; it does not create a separate native app package.
          </div>
        </div>
      </div>
    </aside>

    <div class="mobile-backdrop" id="mobileBackdrop"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="openSidebar" aria-label="Open sidebar" title="Chats">☰</button>
          <span class="topbar-title">kage ai</span>
        </div>

        <div class="topbar-right">
          <button class="icon-btn" id="exportChat" title="Export chat" aria-label="Export chat">⇩</button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-area">
        <form class="composer" id="composer">
          <div class="attachment-preview" id="attachmentPreview"></div>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="message kage..."
            aria-label="Message Kage"
          ></textarea>

          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" class="tool-btn" id="attachButton" title="Attach files" aria-label="Attach files">＋</button>
              <input id="fileInput" type="file" multiple hidden
                accept="image/*,text/*,.pdf,.doc,.docx,.json,.csv,.md,.js,.html,.css,.py,.txt,.xml,.yaml,.yml,.log,.mp4,.webm,.mov,.mp3,.wav,.m4a">

              <button type="button" class="tool-btn" id="voiceButton" title="Voice input" aria-label="Voice input">🎙</button>
              <button type="button" class="tool-btn" id="speakButton" title="Read last answer aloud" aria-label="Read last answer aloud">◖))</button>
            </div>

            <div class="composer-send-tools">
              <button type="button" class="tool-btn" id="clearFiles" title="Remove attachments" aria-label="Remove attachments">×</button>
              <button type="submit" class="send-btn" id="sendButton" title="Send message" aria-label="Send message">↑</button>
            </div>
          </div>
        </form>

        <div class="disclaimer">kage can make mistakes. verify important information.</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="modal-backdrop" id="renameModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
      <h2 id="renameTitle">rename chat</h2>
      <input id="renameInput" maxlength="60" placeholder="chat name">
      <div class="modal-actions">
        <button id="renameCancel">cancel</button>
        <button class="primary" id="renameSave">save</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "kage-chats-v4";
      const ACTIVE_KEY = "kage-active-v4";

      const $ = id => document.getElementById(id);

      const elements = {
        sidebar: $("sidebar"),
        chatList: $("chatList"),
        conversation: $("conversation"),
        messages: $("messages"),
        composer: $("composer"),
        input: $("messageInput"),
        send: $("sendButton"),
        fileInput: $("fileInput"),
        attachmentPreview: $("attachmentPreview"),
        toast: $("toast"),
        renameModal: $("renameModal"),
        renameInput: $("renameInput"),
        downloadMenu: $("downloadMenu"),
        downloadButton: $("downloadButton"),
        mobileBackdrop: $("mobileBackdrop")
      };

      let chats = loadChats();
      let activeChatId = localStorage.getItem(ACTIVE_KEY);
      let attachments = [];
      let busy = false;
      let abortController = null;
      let toastTimer = null;
      let renameTarget = null;
      let recognition = null;
      let lastAssistantText = "";

      function uid() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function loadChats() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved) ? saved : [];
        } catch {
          return [];
        }
      }

      function saveChats() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
          if (activeChatId) localStorage.setItem(ACTIVE_KEY, activeChatId);
        } catch {
          toast("couldn't save chat history in this browser");
        }
      }

      function currentChat() {
        return chats.find(chat => chat.id === activeChatId) || null;
      }

      function createChat() {
        const chat = {
          id: uid(),
          title: "New Chat",
          messages: [],
          createdAt: Date.now(),
          updatedAt: Date.now()
        };

        chats.unshift(chat);
        activeChatId = chat.id;
        saveChats();
        renderChatList();
        renderMessages();
        closeSidebarMobile();
        elements.input.focus();
      }

      function ensureChat() {
        let chat = currentChat();
        if (!chat) {
          createChat();
          chat = currentChat();
        }
        return chat;
      }

      function updateChatTimestamp(chat) {
        chat.updatedAt = Date.now();
        chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }

      function toast(message) {
        elements.toast.textContent = message;
        elements.toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          elements.toast.hidden = true;
        }, 2400);
      }

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeURL(value) {
        try {
          const url = new URL(value, location.href);
          if (["http:", "https:"].includes(url.protocol)) {
            return url.href;
          }
        } catch {}
        return "";
      }

      function inlineMarkdown(text) {
        let safe = escapeHTML(text);

        safe = safe.replace(
          /`([^`\n]+)`/g,
          "<code>$1</code>"
        );

        safe = safe.replace(
          /\*\*(.+?)\*\*/g,
          "<strong>$1</strong>"
        );

        safe = safe.replace(
          /(^|[^*])\*([^*\n]+)\*/g,
          "$1<em>$2</em>"
        );

        safe = safe.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          (whole, label, rawUrl) => {
            const url = safeURL(rawUrl);
            return url
              ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`
              : label;
          }
        );

        return safe;
      }

      function renderMarkdown(source) {
        const text = String(source || "").replace(/\r\n/g, "\n");
        const codeBlocks = [];

        let content = text.replace(
          /```([^\n`]*)\n([\s\S]*?)```/g,
          (_, language, code) => {
            const index = codeBlocks.length;
            codeBlocks.push({
              language: language.trim() || "code",
              code
            });
            return `\n@@KAGECODE${index}@@\n`;
          }
        );

        const lines = content.split("\n");
        const output = [];
        let paragraph = [];
        let listType = null;
        let listItems = [];

        function flushParagraph() {
          if (paragraph.length) {
            output.push(
              `<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`
            );
            paragraph = [];
          }
        }

        function flushList() {
          if (listType && listItems.length) {
            output.push(
              `<${listType}>${listItems.map(item =>
                `<li>${inlineMarkdown(item)}</li>`
              ).join("")}</${listType}>`
            );
          }

          listType = null;
          listItems = [];
        }

        for (const line of lines) {
          const trimmed = line.trim();

          const codeMarker = trimmed.match(/^@@KAGECODE(\d+)@@$/);
          if (codeMarker) {
            flushParagraph();
            flushList();

            const block = codeBlocks[Number(codeMarker[1])];
            const language = escapeHTML(block.language);
            const code = escapeHTML(block.code);

            output.push(
              `<div class="code-wrap">
                <div class="code-header">
                  <span>${language}</span>
                  <button type="button" data-copy-code>copy code</button>
                </div>
                <pre><code>${code}</code></pre>
              </div>`
            );
            continue;
          }

          if (!trimmed) {
            flushParagraph();
            flushList();
            continue;
          }

          const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            flushList();
            const level = heading[1].length;
            output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          const bullet = trimmed.match(/^[-*+]\s+(.+)$/);
          const numbered = trimmed.match(/^\d+[.)]\s+(.+)$/);
          const quote = trimmed.match(/^>\s?(.*)$/);

          if (bullet || numbered) {
            flushParagraph();
            const type = bullet ? "ul" : "ol";

            if (listType && listType !== type) flushList();

            listType = type;
            listItems.push((bullet || numbered)[1]);
            continue;
          }

          flushList();

          if (quote) {
            flushParagraph();
            output.push(`<blockquote>${inlineMarkdown(quote[1])}</blockquote>`);
            continue;
          }

          paragraph.push(trimmed);
        }

        flushParagraph();
        flushList();

        return output.join("\n");
      }

          select.addEventListener("click", () => {
            activeChatId = chat.id;

            renderChatList();
            renderMessages();
            closeSidebarMobile();

          const menu = document.createElement("button");
          menu.className = "chat-menu-btn";

          menu.addEventListener("click", event => {

              "rename"

            if (!action) return;

            if (action.toLowerCase() === "rename") {
              openRename(chat);
            } else if (action.toLowerCase() === "delete") {
              deleteChat(chat.id);

          row.append(select, menu);

          let pressTimer;
          let longPressed = false;

          select.addEventListener("contextmenu", event => {
            event.preventDefault();
            openRename(chat);
          });

          select.addEventListener("touchstart", () => {
            longPressed = false;
            pressTimer = setTimeout(() => {
              longPressed = true;
              openRename(chat);
            }, 650);
          }, { passive: true });

          ["touchend", "touchmove", "touchcancel"].forEach(type => {
            select.addEventListener(type, () => clearTimeout(pressTimer), {
              passive: true
            });
          });

          select.addEventListener("click", event => {
            if (longPressed) {
              event.preventDefault();
              event.stopImmediatePropagation();
              longPressed = false;

          elements.chatList.appendChild(row);

              <button class="suggestion" data-prompt="explain something i'm confused about in a simple way">explain something simply</button>

              <button class="suggestion" data-prompt="help me come up with a creative idea">come up with an idea</button>
              <button class="suggestion" data-prompt="help me solve a problem step by step">help me solve a problem</button>

      function createMessageElement(message, index) {
        const wrapper = document.createElement("article");
        wrapper.className = "message " + message.role;

        const content = document.createElement("div");
        content.className = "message-content";

        if (message.role === "assistant") {
          content.innerHTML = renderMarkdown(message.content || "");
        } else {
          content.textContent = message.content || "";
        }

        wrapper.appendChild(content);

        if (message.attachments && message.attachments.length) {
          const fileList = document.createElement("div");
          fileList.style.cssText = "margin-top:6px;color:#888;font-size:11px";

          fileList.textContent = message.attachments
            .map(file => "📎 " + file.name)
            .join(" · ");

          wrapper.appendChild(fileList);
        }

        if (message.role === "assistant" && !message.pending) {
          const actions = document.createElement("div");
          actions.className = "message-actions";

          const copy = document.createElement("button");
          copy.textContent = "copy";
          copy.addEventListener("click", () => copyText(message.content || ""));

          const regenerate = document.createElement("button");
          regenerate.textContent = "regenerate";
          regenerate.addEventListener("click", () => regenerateAnswer(index));

          actions.append(copy, regenerate);
          wrapper.appendChild(actions);
        }

        if (message.role === "user" && !message.pending) {
          const actions = document.createElement("div");
          actions.className = "message-actions";

          const edit = document.createElement("button");
          edit.textContent = "edit";
          edit.addEventListener("click", () => editMessage(index));

          actions.appendChild(edit);
          wrapper.appendChild(actions);
        }

        if (message.pending) {
          const typing = document.createElement("div");
          typing.className = "typing";
          typing.innerHTML = "<span></span><span></span><span></span>";
          wrapper.appendChild(typing);
        }

        return wrapper;
      }

        elements.renameInput.select();

        const chat = chats.find(item => item.id === renameTarget);
        const title = elements.renameInput.value.trim();

        if (chat && title) {
          chat.title = title.slice(0, 60);
          updateChatTimestamp(chat);
          saveChats();
          renderChatList();

        closeRename();

      function deleteChat(id) {
        const chat = chats.find(item => item.id === id);
        if (!chat) return;

        if (!confirm(`delete "${chat.title || "New Chat"}"?`)) return;

        chats = chats.filter(item => item.id !== id);

        if (activeChatId === id) {
          activeChatId = chats[0]?.id || null;
        }

        saveChats();

        if (!activeChatId) {
          createChat();
        } else {
          renderChatList();
          renderMessages();
        }
      }

      function autoResize() {
        elements.input.style.height = "auto";
        elements.input.style.height =
          Math.min(elements.input.scrollHeight, 200) + "px";
      }

      function updateTitle(chat) {
        if (!chat || !chat.messages.some(m => m.role === "user")) return;

        fetch("/api/title", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: chat.messages
              .filter(m => m.role === "user" || m.role === "assistant")
              .map(m => ({ role: m.role, content: m.content }))
          })
        })
          .then(response => {
            if (!response.ok) throw new Error("title request failed");
            return response.json();
          })
          .then(data => {
            if (!data.title || currentChat()?.id !== chat.id) return;

            const words = String(data.title).trim().split(/\s+/).slice(0, 3);
            chat.title = words.join(" ");
            updateChatTimestamp(chat);
            saveChats();
            renderChatList();
          })
          .catch(() => {
            if (!chat.messages.some(m => m.role === "assistant")) return;
            if (chat.title !== "New Chat") return;

            const firstUser = chat.messages.find(m => m.role === "user");
            if (firstUser) {
              chat.title = firstUser.content
                .trim()
                .split(/\s+/)
                .slice(0, 3)
                .join(" ");
              saveChats();
              renderChatList();
            }
          });
      }

      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = reject;
          reader.readAsText(file);
        });
      }

      async function addFiles(fileList) {
        const selected = Array.from(fileList || []);

        for (const file of selected) {
          if (file.size > 4 * 1024 * 1024) {
            toast(file.name + " is too large (max 4 MB)");
            continue;
          }

          const attachment = {
            id: uid(),
            name: file.name,
            type: file.type || "application/octet-stream",
            size: file.size,
            dataUrl: null,
            text: null
          };

          try {
            if (file.type.startsWith("image/")) {
              attachment.dataUrl = await readFileAsDataURL(file);
            } else if (
              file.type.startsWith("text/") ||
              /\.(txt|md|json|csv|js|html|css|py|xml|yaml|yml|log)$/i.test(file.name)
            ) {
              attachment.text = (await readFileAsText(file)).slice(0, 60000);
            }
          } catch {
            toast("couldn't read " + file.name);
            continue;
          }

          attachments.push(attachment);
        }

        renderAttachments();
        elements.fileInput.value = "";
      }

      function renderAttachments() {
        elements.attachmentPreview.innerHTML = "";

        attachments.forEach(file => {
          const chip = document.createElement("div");
          chip.className = "attachment-chip";

          const label = document.createElement("span");
          label.textContent = file.name;
          label.title = file.name;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "×";
          remove.title = "Remove file";
          remove.addEventListener("click", () => {
            attachments = attachments.filter(item => item.id !== file.id);
            renderAttachments();
          });

          chip.append(label, remove);
          elements.attachmentPreview.appendChild(chip);
        });

        $("clearFiles").style.visibility = attachments.length ? "visible" : "hidden";
      }

      function makeUserContent(text, files) {
        const pieces = [];

        if (text.trim()) pieces.push(text.trim());

        files.forEach(file => {
          if (file.text) {
            pieces.push(`\n[file: ${file.name}]\n${file.text}`);
          } else if (file.dataUrl) {
            pieces.push(`[image attached: ${file.name}]`);
          } else {
            pieces.push(`[file attached: ${file.name}]`);
          }
        });

        return pieces.join("\n\n");
      }

      async function readStream(response, onChunk) {
        if (!response.body) {
          const text = await response.text();
          onChunk(text);
          return text;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = "";
        let buffer = "";
        let isSSE = false;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          if (!isSSE && buffer.startsWith("data:")) {
            isSSE = true;
          }

          if (!isSSE) {
            fullText += decoder.decode(value, { stream: false });
            onChunk(fullText);
            continue;
          }

          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data:")) continue;

            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;

            try {
              const data = JSON.parse(payload);

              if (data.response) {
                fullText += data.response;
                onChunk(fullText);
              } else if (data.text) {
                fullText += data.text;
                onChunk(fullText);
              } else if (data.error) {
                throw new Error(data.error);
              }
            } catch (error) {
              if (error instanceof SyntaxError) continue;
              throw error;
            }
          }
        }

        if (buffer.trim() && !isSSE) {
          fullText += buffer;
          onChunk(fullText);
        }

        return fullText;
      }

      async function sendMessage(textOverride = null) {
        if (busy) return;

        const text = textOverride !== null
          ? textOverride
          : elements.input.value;

        const files = attachments.slice();

        if (!text.trim() && !files.length) return;

        const chat = ensureChat();
        const userContent = makeUserContent(text, files);

        chat.messages.push({
          role: "user",
          content: userContent,
          attachments: files.map(file => ({ name: file.name, type: file.type }))
        });

        attachments = [];
        renderAttachments();
        elements.input.value = "";
        autoResize();

        busy = true;
        abortController = new AbortController();
        elements.send.textContent = "■";
        elements.send.classList.add("stop");
        elements.send.title = "Stop generating";

        const assistantMessage = {
          role: "assistant",
          content: "",
          pending: true
        };

        chat.messages.push(assistantMessage);
        updateChatTimestamp(chat);
        saveChats();
        renderChatList();
        renderMessages();

        const image = files.find(file => file.dataUrl)?.dataUrl || null;

        const payloadMessages = chat.messages
          .filter(message => !message.pending)
          .map(message => ({
            role: message.role,
            content: message.content
          }));

        const last = payloadMessages[payloadMessages.length - 1];

        if (last && last.role === "user" && image) {
          last.content += "\n[an image is attached to this message]";
        }

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: abortController.signal,
            body: JSON.stringify({
              messages: payloadMessages,
              image,
              attachments: files.map(file => ({
                name: file.name,
                type: file.type,
                text: file.text,
                dataUrl: file.dataUrl
              }))
            })
          });

          if (!response.ok) {
            let message = "request failed (" + response.status + ")";

            try {
              const data = await response.json();
              if (data.error) message = data.error;
              if (data.details) message += ": " + data.details;
            } catch {}

            throw new Error(message);
          }

          const contentType = response.headers.get("content-type") || "";

          if (contentType.includes("application/json")) {
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            assistantMessage.content = data.response || data.text || "";
          } else {
            await readStream(response, fullText => {
              assistantMessage.content = fullText;
              assistantMessage.pending = false;
              lastAssistantText = fullText;

              if (currentChat()?.id === chat.id) {
                renderMessages();
              }
            });
          }

          assistantMessage.pending = false;

          if (!assistantMessage.content.trim()) {
            assistantMessage.content = "i didn't get a response back. try sending that again.";
          }

          lastAssistantText = assistantMessage.content;
        } catch (error) {
          assistantMessage.pending = false;

          if (error.name === "AbortError") {
            if (!assistantMessage.content.trim()) {
              chat.messages = chat.messages.filter(m => m !== assistantMessage);
            }
          } else {
            assistantMessage.content =
              "something went wrong: " + (error.message || "request failed");
            assistantMessage.isError = true;
          }
        } finally {
          busy = false;
          abortController = null;
          elements.send.textContent = "↑";
          elements.send.classList.remove("stop");
          elements.send.title = "Send message";

          updateChatTimestamp(chat);
          saveChats();

          if (currentChat()?.id === chat.id) {
            renderMessages();
          }

          renderChatList();
          updateTitle(chat);
          elements.input.focus();
        }
      }

      async function regenerateAnswer(index) {
        if (busy) return;

        const chat = currentChat();
        if (!chat) return;

        const assistantIndex = index;
        const previousUserIndex = chat.messages
          .slice(0, assistantIndex)
          .map(message => message.role)
          .lastIndexOf("user");

        if (previousUserIndex < 0) return;

        chat.messages = chat.messages.slice(0, assistantIndex);
        saveChats();
        renderMessages();

        const userMessage = chat.messages[previousUserIndex];
        await sendMessage(userMessage.content);
      }

      function editMessage(index) {
        if (busy) return;

        const chat = currentChat();
        if (!chat) return;

        const message = chat.messages[index];
        if (!message || message.role !== "user") return;

        elements.input.value = message.content;
        chat.messages = chat.messages.slice(0, index);
        saveChats();
        renderMessages();
        autoResize();
        elements.input.focus();
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          toast("copied");
        } catch {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();

          try {
            document.execCommand("copy");
            toast("copied");
          } catch {
            toast("couldn't copy");
          }

          area.remove();
        }
      }

      function exportChat() {
        const chat = currentChat();
        if (!chat) {
          toast("no chat to export");
          return;
        }

        const blob = new Blob(
          [JSON.stringify(chat, null, 2)],
          { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download =
          (chat.title || "kage-chat")
            .replace(/[^\w -]/g, "")
            .replace(/\s+/g, "-")
            .slice(0, 60) + ".json";

        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

        elements.mobileBackdrop.classList.toggle("open");

        elements.sidebar.classList.remove("open");

      function startVoiceInput() {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          toast("voice input isn't supported in this browser");
          return;
        }

        if (recognition) {
          recognition.stop();
          recognition = null;
          $("voiceButton").style.color = "";
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = navigator.language || "en-US";
        recognition.interimResults = true;
        recognition.continuous = false;

        const originalText = elements.input.value;

        recognition.onstart = () => {
          $("voiceButton").style.color = "#fff";
          toast("listening...");
        };

        recognition.onresult = event => {
          let transcript = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }

          elements.input.value = originalText
            ? originalText + " " + transcript
            : transcript;

          autoResize();
        };

        recognition.onerror = () => {
          toast("couldn't hear that. try again");
        };

        recognition.onend = () => {
          recognition = null;
          $("voiceButton").style.color = "";
        };

        recognition.start();
      }

      function speakLastAnswer() {
        if (!("speechSynthesis" in window)) {
          toast("read aloud isn't supported in this browser");
          return;
        }

        const chat = currentChat();
        const latest = chat?.messages
          .slice()
          .reverse()
          .find(message => message.role === "assistant" && message.content);

        if (!latest) {
          toast("no answer to read yet");
          return;
        }

        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(latest.content);
        utterance.rate = 1.05;
        speechSynthesis.speak(utterance);
      }

        const button = event.target.closest("[data-copy-code]");
        if (!button) return;

        const code = button.closest(".code-wrap")?.querySelector("pre code");
        if (code) copyText(code.textContent);
      }

      elements.messages.addEventListener("click", handleCodeCopy);

      $("newChat").addEventListener("click", createChat);
      $("newChatTop").addEventListener("click", createChat);

      $("openSidebar").addEventListener("click", toggleSidebar);
      $("closeSidebar").addEventListener("click", closeSidebarMobile);
      elements.mobileBackdrop.addEventListener("click", closeSidebarMobile);

      elements.downloadButton.addEventListener("click", () => {
        const open = elements.downloadMenu.classList.toggle("open");
        elements.downloadButton.setAttribute("aria-expanded", String(open));
      });

      document.querySelectorAll(".download-option").forEach(button => {
        button.addEventListener("click", async () => {
          const device = button.dataset.device;
          elements.downloadMenu.classList.remove("open");
          elements.downloadButton.setAttribute("aria-expanded", "false");

          const isStandalone = window.matchMedia("(display-mode: standalone)").matches;

          if (isStandalone) {
            toast("kage is already installed in this browser");
            return;
          }

          if (window.deferredInstallPrompt) {
            window.deferredInstallPrompt.prompt();
            await window.deferredInstallPrompt.userChoice;
            window.deferredInstallPrompt = null;
            return;
          }

          let instructions;

          if (/iphone|ipad/i.test(device)) {
            instructions =
              "on your apple device, open kage in safari, tap share, then tap 'add to home screen'.";
          } else if (/android/i.test(device)) {
            instructions =
              "open kage in chrome, tap the browser menu, then choose 'install app' or 'add to home screen'.";
          } else {
            instructions =
              "open kage in edge or chrome and use the install icon in the address bar, or open the browser menu and choose 'install this site as an app' if available.";
          }

          alert(device + "\n\n" + instructions);
        });
      });

      window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        window.deferredInstallPrompt = event;
      });

      $("exportChat").addEventListener("click", exportChat);

      $("attachButton").addEventListener("click", () => {
        elements.fileInput.click();
      });

      elements.fileInput.addEventListener("change", event => {
        addFiles(event.target.files);
      });

      $("clearFiles").addEventListener("click", () => {
        attachments = [];
        renderAttachments();
      });

      $("voiceButton").addEventListener("click", startVoiceInput);
      $("speakButton").addEventListener("click", speakLastAnswer);

      elements.composer.addEventListener("submit", event => {
        event.preventDefault();

        if (busy && abortController) {
          abortController.abort();
          return;
        }

        sendMessage();
      });

      elements.input.addEventListener("input", autoResize);

      elements.input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          if (busy) return;
          sendMessage();
        }
      });

      $("renameCancel").addEventListener("click", closeRename);
      $("renameSave").addEventListener("click", saveRename);

      elements.renameInput.addEventListener("keydown", event => {
        if (event.key === "Enter") saveRename();
        if (event.key === "Escape") closeRename();
      });

      elements.renameModal.addEventListener("click", event => {
        if (event.target === elements.renameModal) closeRename();
      });

      document.addEventListener("click", event => {
        if (
          !elements.downloadMenu.contains(event.target) &&
          !elements.downloadButton.contains(event.target)
        ) {
          elements.downloadMenu.classList.remove("open");
          elements.downloadButton.setAttribute("aria-expanded", "false");
        }
      });

      window.addEventListener("storage", event => {
        if (event.key === STORAGE_KEY) {
          chats = loadChats();
          renderChatList();
          renderMessages();
        }
      });

      if (!chats.length) {
        createChat();
      } else {
        if (!chats.some(chat => chat.id === activeChatId)) {
          activeChatId = chats[0].id;
        }

        saveChats();
        renderChatList();
        renderMessages();
      }

      renderAttachments();
      autoResize();
    })();
  </script>
</body>
</html>
