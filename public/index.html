<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="kage ai">
<link rel="manifest" href="/manifest.json">
<title>kage</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #080808;
  --hover: #141414;
  --border: #242424;
  --text: #f5f5f5;
  --muted: #858585;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: #000;
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
}

body { overflow: hidden; }
button, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible {
  outline: 1px solid #777;
  outline-offset: 2px;
}

button:disabled { opacity: .5; cursor: not-allowed; }

.app { display: flex; width: 100%; height: 100dvh; background: #000; }

.sidebar {
  width: 254px;
  min-width: 254px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #050505;
  border-right: 1px solid #181818;
  padding: 17px 12px 12px;
  transition: transform .2s ease;
}

.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7px 23px;
}

.brand {
  color: #fff;
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -1px;
  text-decoration: none;
}

.brand-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-left: 2px;
  border-radius: 50%;
  background: white;
  vertical-align: middle;
}

.icon-button {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: #aaa;
  font-size: 17px;
  flex-shrink: 0;
}

.icon-button:hover { background: #141414; color: #fff; }

.new-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  background: #fff;
  color: #000;
  border: 0;
  border-radius: 10px;
  font-weight: 600;
  text-align: left;
}

.new-chat:hover { background: #ddd; }
.new-chat .plus { font-size: 21px; font-weight: 400; }

.section-label {
  padding: 26px 9px 9px;
  color: #656565;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}

.chat-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}

.chat-item {
  width: 100%;
  min-height: 39px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px 0 11px;
  margin-bottom: 3px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: #aaa;
  text-align: left;
}

.chat-item:hover, .chat-item.active {
  background: #141414;
  color: #fff;
}

.chat-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  background: transparent;
  border: 0;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.chat-menu {
  color: #888;
  opacity: 0;
  font-size: 17px;
  padding: 2px 4px;
  background: transparent;
  border: 0;
}

.chat-item:hover .chat-menu,
.chat-item.active .chat-menu { opacity: 1; }

.sidebar-bottom { padding-top: 12px; border-top: 1px solid #1b1b1b; }

.profile-row { display: flex; align-items: center; gap: 10px; padding: 9px 7px 3px; }

.profile-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid #333;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}

.profile-name { color: #ddd; font-size: 12px; }
.profile-status { margin-top: 3px; color: #666; font-size: 11px; }

.main {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
}

.topbar {
  height: 58px;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 24px;
  border-bottom: 1px solid #151515;
}

.topbar-left, .topbar-right { display: flex; align-items: center; gap: 9px; }
.mobile-menu { display: none; }

.model-label { color: #eee; font-size: 13px; font-weight: 600; }
.model-sub { color: #696969; font-size: 11px; margin-left: 7px; }

.status { display: flex; align-items: center; gap: 7px; color: #888; font-size: 11px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #777; }

.conversation {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #292929 transparent;
  scroll-behavior: smooth;
}

.messages { width: 100%; max-width: 790px; margin: 0 auto; padding: 36px 28px 38px; }

.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px 0 70px;
}

.welcome-mark {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  margin-bottom: 27px;
  border: 1px solid #303030;
  border-radius: 15px;
  background: #080808;
  color: white;
  font-size: 23px;
}

.welcome h1 {
  margin: 0;
  color: #f7f7f7;
  font-size: clamp(25px, 3vw, 34px);
  font-weight: 550;
  letter-spacing: -1.5px;
  text-align: center;
}

.welcome p {
  max-width: 340px;
  margin: 12px 0 29px;
  color: #777;
  font-size: 13px;
  line-height: 1.7;
  text-align: center;
}

.suggestions {
  width: 100%;
  max-width: 530px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.suggestion {
  min-height: 67px;
  padding: 13px 14px;
  background: #050505;
  border: 1px solid #242424;
  border-radius: 10px;
  color: #ccc;
  text-align: left;
}

.suggestion:hover { background: #0c0c0c; border-color: #555; }
.suggestion strong { display: block; margin-bottom: 5px; color: #eee; font-size: 12px; }
.suggestion span { display: block; color: #777; font-size: 11px; line-height: 1.5; }

.message { display: flex; flex-direction: column; margin: 0 0 29px; min-width: 0; }
.message.user { align-items: flex-end; }
.message.assistant { align-items: flex-start; }

.message-role {
  margin: 0 0 8px 2px;
  color: #777;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.message.user .message-role { display: none; }

.message-content {
  max-width: 100%;
  min-width: 0;
  color: #e9e9e9;
  font-size: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message.user .message-content {
  max-width: min(85%, 560px);
  padding: 10px 14px;
  background: #151515;
  border: 1px solid #252525;
  border-radius: 15px 15px 4px 15px;
  color: #f7f7f7;
  white-space: pre-wrap;
}

.message.assistant .message-content { width: 100%; }
.message-content p { margin: 0 0 12px; }
.message-content p:last-child { margin-bottom: 0; }

.message-content pre {
  max-width: 100%;
  overflow-x: auto;
  padding: 14px;
  background: #080808;
  border: 1px solid #292929;
  border-radius: 9px;
  color: #eee;
  font-size: 12px;
  line-height: 1.65;
  white-space: pre;
}

.message-content code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.message-content :not(pre) > code {
  padding: 2px 5px;
  background: #161616;
  border: 1px solid #252525;
  border-radius: 4px;
  font-size: .9em;
}

.message-content a {
  color: #fff;
  text-decoration: underline;
  text-decoration-color: #777;
  text-underline-offset: 3px;
}

.message-content ul, .message-content ol { padding-left: 22px; }
.message-content li { margin: 4px 0; }

.message-actions { display: flex; gap: 3px; margin: 8px 0 0; opacity: .7; }
.message-actions button {
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: #888;
  font-size: 11px;
}

.message-actions button:hover { background: #151515; color: #fff; }

.typing { display: flex; align-items: center; gap: 5px; padding: 8px 2px; }
.typing span {
  width: 5px;
  height: 5px;
  background: #777;
  border-radius: 50%;
  animation: blink 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }

@keyframes blink {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

.attachment-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

.attachment-chip {
  max-width: 230px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 8px;
  color: #ccc;
  font-size: 11px;
}

.attachment-chip button { border: 0; background: transparent; color: #999; padding: 0 2px; }

.composer-area { width: 100%; padding: 12px 24px 17px; background: #000; }
.composer-wrap { width: 100%; max-width: 790px; margin: 0 auto; }

.composer {
  padding: 11px 12px 9px;
  background: #080808;
  border: 1px solid #303030;
  border-radius: 15px;
  transition: border-color .15s;
}

.composer:focus-within { border-color: #505050; }

#prompt {
  display: block;
  width: 100%;
  min-height: 30px;
  max-height: 190px;
  resize: none;
  overflow-y: auto;
  padding: 5px 4px 8px;
  border: 0;
  outline: none;
  background: transparent;
  color: #f5f5f5;
  font-size: 14px;
  line-height: 1.6;
}

#prompt::placeholder { color: #686868; }

.composer-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tool-left, .tool-right { display: flex; align-items: center; gap: 5px; }

.tool-button {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #999;
  font-size: 11px;
  white-space: nowrap;
}

.tool-button:hover { background: #171717; color: #fff; }
.tool-button.selected { background: #171717; border-color: #333; color: #fff; }

.send-button {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 9px;
  background: #fff;
  color: #000;
  font-size: 17px;
  font-weight: 700;
}

.send-button:hover { background: #ddd; }
.send-button.stop { background: #222; color: #fff; border: 1px solid #444; }

.composer-note { padding-top: 10px; color: #555; font-size: 10px; text-align: center; }
.hidden { display: none !important; }
#file-input { display: none; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 110px;
  z-index: 100;
  transform: translateX(-50%);
  padding: 10px 14px;
  border: 1px solid #333;
  border-radius: 9px;
  background: #111;
  color: #eee;
  font-size: 12px;
  box-shadow: 0 8px 35px #000;
}

/* download menu */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 18px;
  background: #000c;
}

.modal {
  width: min(100%, 490px);
  max-height: 85dvh;
  overflow-y: auto;
  padding: 22px;
  background: #050505;
  border: 1px solid #303030;
  border-radius: 15px;
  box-shadow: 0 20px 80px #000;
}

.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.modal h2 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
.modal-subtitle { margin: 8px 0 18px; color: #888; font-size: 12px; line-height: 1.6; }

.device-options { display: grid; gap: 8px; }

.device-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px;
  border: 1px solid #252525;
  border-radius: 10px;
  background: #080808;
  text-align: left;
}

.device-option:hover { background: #121212; border-color: #555; }

.device-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid #333;
  border-radius: 9px;
  color: #fff;
  font-size: 17px;
}

.device-copy { flex: 1; min-width: 0; }
.device-copy strong { display: block; font-size: 12px; font-weight: 600; }
.device-copy span { display: block; margin-top: 4px; color: #888; font-size: 11px; line-height: 1.5; }
.device-arrow { color: #888; font-size: 17px; }

.instructions {
  margin-top: 14px;
  padding: 13px;
  border: 1px solid #303030;
  border-radius: 9px;
  background: #0a0a0a;
  color: #ccc;
  font-size: 12px;
  line-height: 1.8;
}

.instructions strong { color: #fff; }
.instructions ol { padding-left: 20px; }
.instructions button {
  padding: 8px 11px;
  margin-top: 8px;
  border: 1px solid #444;
  border-radius: 7px;
  background: #fff;
  color: #000;
}

.mobile-overlay { display: none; }

@media (max-width: 760px) {
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 30;
    width: 270px;
    min-width: 270px;
    transform: translateX(-100%);
    box-shadow: none;
  }

  .sidebar.open { transform: translateX(0); box-shadow: 15px 0 50px #000b; }

  .mobile-overlay.open {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 25;
    background: #0009;
  }

  .mobile-menu { display: inline-flex; }
  .topbar { padding: 0 13px; }
  .model-sub, .status { display: none; }
  .messages { padding: 27px 17px 30px; }
  .composer-area { padding: 8px 12px 12px; }
  .welcome { padding-bottom: 30px; }
  .welcome h1 { font-size: 28px; }
  .suggestions { grid-template-columns: 1fr; }
  .suggestion { min-height: 59px; }
  .tool-button { padding: 0 7px; }
}

@media (max-width: 390px) {
  .tool-label { display: none; }
  .tool-button { min-width: 32px; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="#" id="brand-home">kage<span class="brand-dot"></span></a>
      <button class="icon-button" id="close-sidebar" aria-label="close sidebar">×</button>
    </div>

    <button class="new-chat" id="new-chat"><span class="plus">+</span><span>new chat</span></button>
    <div class="section-label">your chats</div>
    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-bottom">
      <div class="profile-row">
        <div class="profile-mark">K</div>
        <div><div class="profile-name">kage ai</div><div class="profile-status">your space</div></div>
      </div>
    </div>
  </aside>

  <div class="mobile-overlay" id="mobile-overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button mobile-menu" id="open-sidebar" aria-label="open sidebar">☰</button>
        <div><span class="model-label">kage</span><span class="model-sub">your ai, your way</span></div>
      </div>

      <div class="topbar-right">
        <div class="status"><span class="status-dot"></span><span id="connection-label">ready</span></div>
        <button class="icon-button" id="download-button" title="get kage on your device" aria-label="download kage">↓</button>
        <button class="icon-button" id="export-chat" title="export chat" aria-label="export chat">⇩</button>
      </div>
    </header>

    <section class="conversation" id="conversation">
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-area">
      <div class="composer-wrap">
        <div class="attachment-preview hidden" id="attachment-preview"></div>
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="message kage..." aria-label="message kage"></textarea>
          <div class="composer-tools">
            <div class="tool-left">
              <button class="tool-button" id="attach-button" title="attach a file"><span>＋</span><span class="tool-label">attach</span></button>
              <input id="file-input" type="file" multiple accept="image/*,.txt,.md,.json,.csv,.js,.ts,.html,.css,.py,.java,.c,.cpp,.xml,.yaml,.yml,.log,.pdf,.docx,.xlsx,.pptx,.mp4,.webm,.mov">
              <button class="tool-button" id="search-button" title="request web search"><span>⌕</span><span class="tool-label">search</span></button>
              <button class="tool-button" id="voice-button" title="dictate a message"><span>◉</span><span class="tool-label">voice</span></button>
            </div>
            <div class="tool-right"><button class="send-button" id="send-button" title="send message" aria-label="send message">↑</button></div>
          </div>
        </div>
        <div class="composer-note">kage can make mistakes. check important information.</div>
      </div>
    </footer>
  </main>
</div>

<div class="modal-backdrop hidden" id="download-modal" role="dialog" aria-modal="true" aria-labelledby="download-title">
  <div class="modal">
    <div class="modal-head">
      <h2 id="download-title">get kage on your device</h2>
      <button class="icon-button" id="close-download" aria-label="close download menu">×</button>
    </div>
    <p class="modal-subtitle">choose your device to see the installation option for it.</p>

    <div class="device-options">
      <button class="device-option" data-device="iphone"><span class="device-icon">▯</span><span class="device-copy"><strong>iphone</strong><span>add kage to your home screen using safari</span></span><span class="device-arrow">›</span></button>
      <button class="device-option" data-device="ipad"><span class="device-icon">▯</span><span class="device-copy"><strong>ipad</strong><span>install kage as a home-screen web app</span></span><span class="device-arrow">›</span></button>
      <button class="device-option" data-device="android-phone"><span class="device-icon">▯</span><span class="device-copy"><strong>android phone</strong><span>install from chrome when available</span></span><span class="device-arrow">›</span></button>
      <button class="device-option" data-device="android-tablet"><span class="device-icon">▭</span><span class="device-copy"><strong>android tablet</strong><span>install from chrome when available</span></span><span class="device-arrow">›</span></button>
      <button class="device-option" data-device="computer"><span class="device-icon">▣</span><span class="device-copy"><strong>computer</strong><span>install in a supported desktop browser</span></span><span class="device-arrow">›</span></button>
      <button class="device-option" data-device="laptop"><span class="device-icon">▱</span><span class="device-copy"><strong>laptop</strong><span>install in a supported desktop browser</span></span><span class="device-arrow">›</span></button>
    </div>

    <div class="instructions hidden" id="download-instructions"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = selector => document.querySelector(selector);
  const STORAGE_KEY = "kage-chats-v4";
  const ACTIVE_KEY = "kage-active-v4";

  const SYSTEM_PROMPT = [
    "you are kage, a helpful, capable ai assistant.",
    "communicate in lowercase by default, in a relaxed, nonchalant, natural teenage texting style. stay clear and intelligent, not forced or full of slang.",
    "your job is to understand the user's intent, not just their exact words.",
    "interpret typos, shorthand, slang, incomplete sentences, references to earlier messages, and casual wording using the conversation context.",
    "when the user says 'it', 'that', 'the other one', 'same thing', or similar, look back through the conversation to identify the most likely referent.",
    "if the request is reasonably clear from context, act on the best interpretation instead of asking the user to explain it again.",
    "never use generic excuses such as 'that's not in my programming', 'i don't know what you want', or 'i cannot understand your request'. if something is genuinely ambiguous, ask one short, specific question. if a tool or capability is unavailable, explain the actual limitation and give the closest useful alternative.",
    "follow the user's requested format and instructions as closely as possible. do not claim to have completed actions you did not perform.",
    "use prior messages as conversation context. don't treat each message as an isolated request.",
    "for code requests, provide complete, usable code for the requested file whenever possible.",
    "be accurate, don't fabricate facts, and follow applicable safety requirements."
  ].join(" ");

  const state = {
    chats: [],
    activeId: null,
    attachments: [],
    searching: false,
    busy: false,
    controller: null,
    recognition: null,
    installPrompt: null
  };

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function activeChat() {
    return state.chats.find(chat => chat.id === state.activeId);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chats));
      localStorage.setItem(ACTIVE_KEY, state.activeId || "");
    } catch {
      showToast("couldn't save more chat history in this browser");
    }
  }

  function load() {
    try {
      const chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(chats)) state.chats = chats;
      state.activeId = localStorage.getItem(ACTIVE_KEY) || null;
    } catch {
      state.chats = [];
      state.activeId = null;
    }

    if (!activeChat()) state.activeId = null;
    if (!state.activeId && state.chats.length) state.activeId = state.chats[0].id;
    if (!state.activeId) createChat(false);
    renderAll();
  }

  function createChat(focus = true) {
    if (state.busy) stopGeneration();

    const chat = {
      id: uid(),
      title: "new chat",
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    state.chats.unshift(chat);
    state.activeId = chat.id;
    state.attachments = [];
    save();
    renderAll();
    renderAttachments();
    closeMobileSidebar();
    if (focus) $("#prompt").focus();
  }

  function setActive(id) {
    if (state.busy) stopGeneration();
    if (!state.chats.some(chat => chat.id === id)) return;

    state.activeId = id;
    state.attachments = [];
    save();
    renderAll();
    renderAttachments();
    closeMobileSidebar();
  }

  function renameChat(id) {
    const chat = state.chats.find(item => item.id === id);
    if (!chat) return;

    const next = prompt("rename chat", chat.title);
    if (next === null || !next.trim()) return;

    chat.title = next.trim().split(/\s+/).slice(0, 8).join(" ").slice(0, 100);
    chat.updatedAt = Date.now();
    save();
    renderSidebar();
  }

  function deleteChat(id) {
    const index = state.chats.findIndex(chat => chat.id === id);
    if (index < 0) return;

    if (id === state.activeId && state.busy) stopGeneration();
    state.chats.splice(index, 1);

    if (id === state.activeId) {
      state.activeId = state.chats[0]?.id || null;
      if (!state.activeId) createChat(false);
    }

    save();
    renderAll();
  }

  function renderSidebar() {
    const list = $("#chat-list");
    list.replaceChildren();

    for (const chat of state.chats) {
      const row = document.createElement("div");
      row.className = "chat-item" + (chat.id === state.activeId ? " active" : "");

      const title = document.createElement("button");
      title.className = "chat-title";
      title.textContent = chat.title || "new chat";
      title.title = title.textContent;
      title.addEventListener("click", () => setActive(chat.id));

      const menu = document.createElement("button");
      menu.className = "chat-menu";
      menu.textContent = "···";
      menu.title = "chat options";
      menu.setAttribute("aria-label", "chat options");

      menu.addEventListener("click", event => {
        event.stopPropagation();
        const choice = prompt("type rename to rename this chat, or delete to delete it", "rename");
        if (!choice) return;
        if (choice.toLowerCase() === "rename") renameChat(chat.id);
        if (choice.toLowerCase() === "delete") deleteChat(chat.id);
      });

      row.append(title, menu);
      list.append(row);
    }
  }

  function renderWelcome() {
    return `
      <div class="welcome">
        <div class="welcome-mark">k</div>
        <h1>what's on your mind?</h1>
        <p>ask something, work through an idea, or build something useful.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="help me understand something difficult"><strong>explain something</strong><span>make a difficult topic easier to understand</span></button>
          <button class="suggestion" data-prompt="help me build an app. start with working code."><strong>build something</strong><span>turn an idea into a working project</span></button>
          <button class="suggestion" data-prompt="help me solve this problem step by step"><strong>solve a problem</strong><span>work through it without extra fluff</span></button>
          <button class="suggestion" data-prompt="give me a few creative ideas for something new"><strong>think of ideas</strong><span>explore different ways to approach a project</span></button>
        </div>
      </div>`;
  }

  function renderMarkdown(text) {
    let safe = escapeHTML(text);
    const codeBlocks = [];

    safe = safe.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const token = `%%CODEBLOCK${codeBlocks.length}%%`;
      codeBlocks.push(`<pre><code>${code.replace(/\n$/, "")}</code></pre>`);
      return token;
    });

    safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    safe = safe.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    safe = safe.replace(/^(#{1,3})\s+(.+)$/gm, (_, hashes, title) =>
      `<h${hashes.length}>${title}</h${hashes.length}>`);
    safe = safe.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
    safe = safe.replace(/(?:<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
    safe = safe.replace(/\n/g, "<br>");

    codeBlocks.forEach((block, index) => {
      safe = safe.replace(`%%CODEBLOCK${index}%%`, block);
    });

    return safe;
  }

  function renderMessages() {
    const container = $("#messages");
    const chat = activeChat();

    if (!chat || !chat.messages.length) {
      container.innerHTML = renderWelcome();
      container.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          $("#prompt").value = button.dataset.prompt;
          resizeTextarea();
          $("#prompt").focus();
        });
      });
      return;
    }

    container.replaceChildren();

    for (const message of chat.messages) {
      const wrapper = document.createElement("article");
      wrapper.className = "message " + message.role;

      const role = document.createElement("div");
      role.className = "message-role";
      role.textContent = message.role === "assistant" ? "kage" : "you";

      const content = document.createElement("div");
      content.className = "message-content";

      if (message.role === "user") content.textContent = message.content;
      else content.innerHTML = renderMarkdown(message.content || "");

      wrapper.append(role, content);

      if (message.role === "assistant" && message.content) {
        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copy = document.createElement("button");
        copy.textContent = "copy";
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(message.content);
            showToast("copied");
          } catch {
            showToast("couldn't copy this message");
          }
        });

        const regenerate = document.createElement("button");
        regenerate.textContent = "regenerate";
        regenerate.addEventListener("click", regenerateLast);

        actions.append(copy, regenerate);
        wrapper.append(actions);
      }

      container.append(wrapper);
    }

    if (state.busy) {
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";
      container.append(typing);
    }

    scrollToBottom();
  }

  function renderAll() {
    renderSidebar();
    renderMessages();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      const area = $("#conversation");
      area.scrollTop = area.scrollHeight;
    });
  }

  function showToast(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.remove("hidden");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.add("hidden"), 2400);
  }

  function setStatus(text) {
    $("#connection-label").textContent = text;
  }

  function resizeTextarea() {
    const area = $("#prompt");
    area.style.height = "auto";
    area.style.height = Math.min(area.scrollHeight, 190) + "px";
  }

  function renderAttachments() {
    const preview = $("#attachment-preview");
    preview.replaceChildren();

    if (!state.attachments.length) {
      preview.classList.add("hidden");
      return;
    }

    preview.classList.remove("hidden");

    state.attachments.forEach((file, index) => {
      const chip = document.createElement("div");
      chip.className = "attachment-chip";

      const label = document.createElement("span");
      label.textContent = file.name;

      const remove = document.createElement("button");
      remove.textContent = "×";
      remove.title = "remove attachment";
      remove.addEventListener("click", () => {
        state.attachments.splice(index, 1);
        renderAttachments();
      });

      chip.append(label, remove);
      preview.append(chip);
    });
  }

  async function readFile(file) {
    const maxBytes = 4 * 1024 * 1024;
    if (file.size > maxBytes) throw new Error(file.name + " is over the 4 MB per-file limit.");

    const isImage = file.type.startsWith("image/");
    const isText = /\.(txt|md|json|csv|js|ts|html|css|py|java|c|cpp|xml|ya?ml|log)$/i.test(file.name)
      || file.type.startsWith("text/") || file.type === "application/json";

    const item = { name: file.name, type: file.type || "application/octet-stream", size: file.size, data: null, text: null };

    if (isImage) {
      item.data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("couldn't read " + file.name));
        reader.readAsDataURL(file);
      });
    } else if (isText) {
      item.text = await file.text();
      if (item.text.length > 60000) item.text = item.text.slice(0, 60000) + "\n[content truncated]";
    } else {
      item.text = "[attached file: " + file.name + ". this browser client cannot extract its contents automatically.]";
    }

    return item;
  }

  async function addFiles(fileList) {
    for (const file of Array.from(fileList || [])) {
      try {
        state.attachments.push(await readFile(file));
      } catch (error) {
        showToast(error.message || "couldn't attach that file");
      }
    }
    renderAttachments();
  }

  function makeUserContent(text, attachments) {
    const parts = [];

    for (const file of attachments) {
      if (file.text) parts.push("[file: " + file.name + "]\n" + file.text);
      else if (file.data) parts.push("[image attached: " + file.name + "]");
    }

    return [text, ...parts].filter(Boolean).join("\n\n");
  }

  function fallbackTitle(messages) {
    const lastUser = [...messages].reverse().find(message => message.role === "user");
    if (!lastUser) return "new chat";

    const words = lastUser.content
      .replace(/https?:\/\/\S+/g, "")
      .replace(/[^\p{L}\p{N}' -]/gu, " ")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    if (!words.length) return "new chat";

    const stop = new Set(["the", "and", "for", "that", "this", "with", "what", "how", "can", "you", "please", "make", "help", "me", "it", "just", "want", "need", "about"]);
    const useful = words.filter(word => !stop.has(word.toLowerCase()));
    const chosen = (useful.length >= 2 ? useful : words).slice(0, 3);
    return chosen.map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
  }

  async function updateChatTitle(chat) {
    if (!chat || !chat.messages.some(message => message.role === "user")) return;

    try {
      const response = await fetch("/api/title", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: chat.messages
            .filter(message => message.role === "user" || message.role === "assistant")
            .slice(-16)
            .map(message => ({ role: message.role, content: message.content }))
        })
      });

      if (!response.ok) throw new Error("title request failed");

      const data = await response.json();
      const title = normalizeTitle(data.title || "");

      if (title && state.chats.some(item => item.id === chat.id)) {
        chat.title = title;
        chat.updatedAt = Date.now();
        save();
        renderSidebar();
      }
    } catch {
      // Keep the chat usable if title generation fails.
      const title = normalizeTitle(fallbackTitle(chat.messages));
      if (title) {
        chat.title = title;
        save();
        renderSidebar();
      }
    }
  }

  function normalizeTitle(value) {
    const cleaned = String(value)
      .replace(/^["'`#\s]+|["'`#\s]+$/g, "")
      .replace(/^(chat title|title)\s*:\s*/i, "")
      .replace(/[.!?]+$/g, "")
      .replace(/\s+/g, " ")
      .trim();

    const words = cleaned.split(" ").filter(Boolean);
    if (!words.length) return "";

    return words.slice(0, 3).join(" ").slice(0, 60);
  }

  async function parseAIResponse(response, onText) {
    if (!response.ok) {
      const detail = await response.text().catch(() => "");
      throw new Error(detail || `request failed (${response.status})`);
    }

    const type = response.headers.get("content-type") || "";

    if (type.includes("application/json")) {
      const result = await response.json();
      const reply = result.reply ?? result.response ?? result.result?.response ?? "";
      if (typeof reply !== "string" || !reply) throw new Error("the server returned no reply");
      onText(reply);
      return reply;
    }

    if (!response.body) {
      const text = await response.text();
      onText(text);
      return text;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let output = "";

    function processEvent(eventText) {
      for (const line of eventText.split(/\r?\n/)) {
        if (!line.startsWith("data:")) continue;

        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;

        let parsed;
        try {
          parsed = JSON.parse(data);
        } catch {
          output += data;
          onText(output);
          continue;
        }

        const chunk = parsed.response
          ?? parsed.choices?.[0]?.delta?.content
          ?? parsed.choices?.[0]?.message?.content
          ?? parsed.delta
          ?? "";

        if (typeof chunk === "string" && chunk) {
          output += chunk;
          onText(output);
        }
      }
    }

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split(/\r?\n\r?\n/);
      buffer = events.pop() || "";
      events.forEach(processEvent);
    }

    buffer += decoder.decode();
    if (buffer.trim()) processEvent(buffer);

    if (!output.trim()) throw new Error("the server returned an empty reply");
    return output;
  }

  async function sendMessage(explicitText = null, regenerate = false) {
    if (state.busy) return;

    const chat = activeChat();
    if (!chat) return;

    let text = explicitText ?? $("#prompt").value.trim();

    if (regenerate) {
      const lastUserIndex = chat.messages.map(message => message.role).lastIndexOf("user");
      if (lastUserIndex < 0) return;

      text = chat.messages[lastUserIndex].content;
      if (chat.messages[chat.messages.length - 1]?.role === "assistant") chat.messages.pop();
    }

    if (!text && !state.attachments.length) return;

    const attachments = regenerate ? [] : state.attachments.slice();

    if (!regenerate) {
      chat.messages.push({ role: "user", content: makeUserContent(text, attachments) });
      $("#prompt").value = "";
      resizeTextarea();
      state.attachments = [];
      renderAttachments();
    }

    const assistantMessage = { role: "assistant", content: "" };
    chat.messages.push(assistantMessage);

    state.busy = true;
    state.controller = new AbortController();
    $("#send-button").textContent = "■";
    $("#send-button").classList.add("stop");
    setStatus("thinking");
    renderAll();

    // Start naming early, then refresh the name after the assistant responds.
    updateChatTitle(chat);

    try {
      const history = chat.messages
        .filter(message => message.content && ["user", "assistant"].includes(message.role))
        .slice(0, -1)
        .slice(-30)
        .map(message => ({ role: message.role, content: message.content }));

      const image = attachments.find(file => file.data)?.data || null;

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: state.controller.signal,
        body: JSON.stringify({
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            ...history,
            {
              role: "user",
              content: text || "please examine the attached file."
            }
          ],
          image,
          search: state.searching,
          searchResults: [],
          attachments: attachments.map(file => ({
            name: file.name,
            type: file.type,
            text: file.text
          }))
        })
      });

      await parseAIResponse(response, content => {
        assistantMessage.content = content;
        renderMessages();
      });

      setStatus("ready");
    } catch (error) {
      if (error.name === "AbortError") {
        if (!assistantMessage.content) chat.messages.pop();
        setStatus("stopped");
      } else {
        assistantMessage.content =
          "couldn't get a response from the server.\n\n" +
          "error: " + (error.message || "unknown error") +
          "\n\ncheck that your cloudflare worker is deployed and that /api/chat is working.";
        setStatus("error");
      }
    } finally {
      state.busy = false;
      state.controller = null;
      $("#send-button").textContent = "↑";
      $("#send-button").classList.remove("stop");
      chat.updatedAt = Date.now();
      save();
      renderAll();

      // Recalculate the title from the updated conversation, not just the first message.
      updateChatTitle(chat);
    }
  }

  function regenerateLast() {
    sendMessage(null, true);
  }

  function stopGeneration() {
    if (state.controller) state.controller.abort();
  }

  function toggleSearch() {
    state.searching = !state.searching;
    $("#search-button").classList.toggle("selected", state.searching);
    showToast(state.searching ? "search requested for the next message" : "search request turned off");
  }

  function startVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      showToast("voice input isn't supported in this browser");
      return;
    }

    if (state.recognition) {
      state.recognition.stop();
      state.recognition = null;
      $("#voice-button").classList.remove("selected");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = navigator.language || "en-US";
    recognition.interimResults = true;
    recognition.continuous = false;
    state.recognition = recognition;

    recognition.onstart = () => {
      $("#voice-button").classList.add("selected");
      showToast("listening...");
    };

    recognition.onresult = event => {
      let result = "";
      for (let i = event.resultIndex; i < event.results.length; i++) result += event.results[i][0].transcript;
      $("#prompt").value = result;
      resizeTextarea();
    };

    recognition.onerror = () => showToast("couldn't hear that. try again");
    recognition.onend = () => {
      state.recognition = null;
      $("#voice-button").classList.remove("selected");
    };

    recognition.start();
  }

  function exportChat() {
    const chat = activeChat();
    if (!chat) return;

    const blob = new Blob([JSON.stringify(chat, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = (chat.title || "kage-chat").replace(/[^a-z0-9-_ ]/gi, "").replace(/\s+/g, "-") + ".json";
    link.click();

    URL.revokeObjectURL(url);
  }

  function closeMobileSidebar() {
    $("#sidebar").classList.remove("open");
    $("#mobile-overlay").classList.remove("open");
  }

  function openDownloadMenu() {
    $("#download-modal").classList.remove("hidden");
    $("#download-instructions").classList.add("hidden");
  }

  function closeDownloadMenu() {
    $("#download-modal").classList.add("hidden");
  }

    const instructions = {
      iphone: {
        title: "install on iphone",
        steps: [
          "open this Kage website in Safari.",
          "tap the Share button.",
          "choose “Add to Home Screen”.",
          "if shown, enable “Open as Web App”, then tap Add."
        ]
      },
      ipad: {
        title: "install on ipad",
        steps: [
          "open this Kage website in Safari.",
          "tap the Share button.",
          "choose “Add to Home Screen”.",
          "tap Add to put Kage on your home screen."
        ]
      },
      "android-phone": {
        title: "install on android phone",
        steps: [
          "open this Kage website in Chrome.",
          "open the browser menu (⋮).",
          "tap “Install app” or “Add to Home screen” if available.",
          "confirm the installation."
        ]
      },
      "android-tablet": {
        title: "install on android tablet",
        steps: [
          "open this Kage website in Chrome.",
          "open the browser menu (⋮).",
          "tap “Install app” or “Add to Home screen” if available.",
          "confirm the installation."
        ]
      },
      computer: {
        title: "install on computer",
        steps: [
          "open this Kage website in a supported browser such as Chrome or Edge.",
          "look for the install icon in the address bar, or open the browser menu.",
          "choose “Install Kage” or “Install this site as an app” if available.",
          "confirm the installation."
        ]
      },
      laptop: {
        title: "install on laptop",
        steps: [
          "open this Kage website in a supported browser such as Chrome or Edge.",
          "look for the install icon in the address bar, or open the browser menu.",
          "choose “Install Kage” or “Install this site as an app” if available.",

  async function showDeviceInstructions(device) {
    const box = $("#download-instructions");
    const item = deviceInstructions(device);
    box.replaceChildren();

    const title = document.createElement("strong");
    title.textContent = item.title;

    const list = document.createElement("ol");
    item.steps.forEach(step => {
      const li = document.createElement("li");
      li.textContent = step;
      list.append(li);
    });

    box.append(title, list);
    box.classList.remove("hidden");

    if (state.installPrompt && !/iphone|ipad/.test(device)) {
      const button = document.createElement("button");
      button.textContent = "install kage now";
      button.addEventListener("click", async () => {
        try {
          state.installPrompt.prompt();
          await state.installPrompt.userChoice;
        } catch {
          showToast("use the browser's install option instead");
        }
        state.installPrompt = null;
      });
      box.append(button);
    }
  }

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    state.installPrompt = event;
  });

  window.addEventListener("appinstalled", () => {
    state.installPrompt = null;
    showToast("kage installed");
  });

  $("#new-chat").addEventListener("click", () => createChat());
  $("#brand-home").addEventListener("click", event => {
    event.preventDefault();
    createChat();
  });

  $("#send-button").addEventListener("click", () => {
    if (state.busy) stopGeneration();
    else sendMessage();
  });

  $("#prompt").addEventListener("input", resizeTextarea);

  $("#prompt").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  $("#attach-button").addEventListener("click", () => $("#file-input").click());

  $("#file-input").addEventListener("change", async event => {
    await addFiles(event.target.files);
    event.target.value = "";
  });

  $("#search-button").addEventListener("click", toggleSearch);
  $("#voice-button").addEventListener("click", startVoice);
  $("#export-chat").addEventListener("click", exportChat);
  $("#download-button").addEventListener("click", openDownloadMenu);
  $("#close-download").addEventListener("click", closeDownloadMenu);

  $("#download-modal").addEventListener("click", event => {
    if (event.target === $("#download-modal")) closeDownloadMenu();
  });

  document.querySelectorAll("[data-device]").forEach(button => {
    button.addEventListener("click", () => showDeviceInstructions(button.dataset.device));
  });

  $("#open-sidebar").addEventListener("click", () => {
    $("#sidebar").classList.add("open");
    $("#mobile-overlay").classList.add("open");
  });

  $("#close-sidebar").addEventListener("click", closeMobileSidebar);
  $("#mobile-overlay").addEventListener("click", closeMobileSidebar);

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  load();
})();
