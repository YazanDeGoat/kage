<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Kage</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #101010;
      --panel-hover: #1c1c1c;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 2px solid #777;
      outline-offset: 2px;
    }

    .app {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      flex: 0 0 260px;
      background: #080808;
      border-right: 1px solid #202020;
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      transition: margin-left .2s ease;
      z-index: 5;
    }

    .sidebar.hidden {
      display: none;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 5px 16px;
    }

    .brand {
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -.7px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: #c7c7c7;
      font-size: 19px;
      flex-shrink: 0;
    }

    .icon-button:hover {
      background: var(--panel-hover);
      color: white;
    }

    .new-chat {
      width: 100%;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      text-align: left;
      margin-bottom: 20px;
    }

    .new-chat:hover {
      background: #202020;
    }

    .section-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 10px 9px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px;
      border-radius: 10px;
      margin-bottom: 3px;
    }

    .chat-item.active {
      background: #202020;
    }

    .chat-select {
      flex: 1;
      min-width: 0;
      padding: 10px 9px;
      border: 0;
      background: transparent;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #d6d6d6;
    }

    .chat-menu-button {
      opacity: 0;
      border: 0;
      background: transparent;
      color: #aaa;
      border-radius: 7px;
      padding: 6px;
    }

    .chat-item:hover .chat-menu-button,
    .chat-item.active .chat-menu-button {
      opacity: 1;
    }

    .chat-menu-button:hover {
      background: #333;
    }

    .sidebar-bottom {
      padding-top: 12px;
      border-top: 1px solid #222;
      margin-top: 10px;
    }

    .sidebar-action {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #bbb;
      text-align: left;
      font-size: 13px;
    }

    .sidebar-action:hover {
      background: #191919;
      color: white;
    }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #151515;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-label {
      color: #d4d4d4;
      font-size: 14px;
      font-weight: 600;
    }

    .menu-wrap {
      position: relative;
    }

    .dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 220px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 13px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 14px 40px #000b;
    }

    .dropdown.hidden {
      display: none;
    }

    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      color: #e4e4e4;
    }

    .dropdown button:hover {
      background: #292929;
    }

    .download-info {
      border-top: 1px solid #303030;
      padding: 10px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .conversation {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
      text-align: center;
    }

    .welcome h1 {
      margin: 0 0 9px;
      font-size: clamp(27px, 4vw, 36px);
      letter-spacing: -1.2px;
      font-weight: 650;
    }

    .welcome p {
      margin: 0;
      color: #8d8d8d;
      font-size: 14px;
    }

    .suggestions {
      width: min(680px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 28px;
    }

    .suggestion {
      text-align: left;
      padding: 13px;
      border: 1px solid #282828;
      background: #090909;
      border-radius: 12px;
      color: #cfcfcf;
      font-size: 13px;
      line-height: 1.5;
    }

    .suggestion:hover {
      background: #151515;
      border-color: #424242;
    }

    .messages {
      width: min(800px, 100%);
      margin: 0 auto;
      padding: 28px 22px 40px;
    }

    .message {
      margin-bottom: 28px;
      min-width: 0;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .user-bubble {
      max-width: 84%;
      padding: 11px 15px;
      border-radius: 19px;
      background: #202020;
      color: #f5f5f5;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .assistant-message {
      line-height: 1.75;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .assistant-message p {
      margin: 0 0 13px;
    }

    .assistant-message p:last-child {
      margin-bottom: 0;
    }

    .assistant-message h1,
    .assistant-message h2,
    .assistant-message h3 {
      line-height: 1.35;
      margin: 20px 0 9px;
    }

    .assistant-message h1 { font-size: 23px; }
    .assistant-message h2 { font-size: 19px; }
    .assistant-message h3 { font-size: 16px; }

    .assistant-message ul,
    .assistant-message ol {
      padding-left: 24px;
      margin: 8px 0 15px;
    }

    .assistant-message li {
      margin: 4px 0;
    }

    .assistant-message blockquote {
      margin: 12px 0;
      padding-left: 14px;
      border-left: 3px solid #555;
      color: #bbb;
    }

    .assistant-message a {
      color: #a5c9ff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .assistant-message pre {
      overflow-x: auto;
      padding: 15px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    .assistant-message code {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: .92em;
    }

    .assistant-message :not(pre) > code {
      background: #252525;
      border-radius: 5px;
      padding: 2px 5px;
    }

    .assistant-message table {
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      max-width: 100%;
    }

    .assistant-message th,
    .assistant-message td {
      border: 1px solid #383838;
      padding: 8px 10px;
      text-align: left;
    }

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 9px;
      opacity: .75;
    }

    .message-actions button {
      border: 0;
      background: transparent;
      color: #888;
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 12px;
    }

    .message-actions button:hover {
      background: #202020;
      color: white;
    }

    .file-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 9px;
    }

    .file-chip {
      background: #111;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      color: #bbb;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .composer-area {
      padding: 10px 20px 14px;
      background: linear-gradient(transparent, #000 20%);
    }

    .composer-wrap {
      width: min(800px, 100%);
      margin: 0 auto;
    }

    .attachment-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .attachment-item {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 7px 9px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 10px;
      color: #ddd;
      font-size: 12px;
    }

    .attachment-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 190px;
    }

    .attachment-item button {
      border: 0;
      background: transparent;
      color: #aaa;
      padding: 0 3px;
    }

    .composer {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 23px;
      padding: 10px 10px 8px;
      box-shadow: 0 0 0 1px #080808;
    }

    .composer:focus-within {
      border-color: #454545;
    }

    .composer textarea {
      display: block;
      width: 100%;
      resize: none;
      max-height: 190px;
      min-height: 28px;
      border: 0;
      outline: none;
      background: transparent;
      color: #f5f5f5;
      padding: 5px 8px 8px;
      line-height: 1.5;
      font-size: 14px;
    }

    .composer textarea::placeholder {
      color: #777;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .composer-tools,
    .composer-send {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 35px;
      height: 35px;
      padding: 0 9px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #bcbcbc;
      font-size: 19px;
    }

    .tool-button:hover {
      background: #292929;
      color: white;
    }

    .send-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f5f5f5;
      color: #050505;
      font-size: 19px;
      font-weight: 700;
    }

    .send-button:hover {
      background: #d7d7d7;
    }

    .send-button:disabled {
      opacity: .35;
      cursor: default;
    }

    .footnote {
      color: #686868;
      text-align: center;
      font-size: 10px;
      padding-top: 9px;
    }

    .status {
      color: #8e8e8e;
      font-size: 12px;
      margin: 0 0 8px;
      min-height: 17px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      padding: 10px 15px;
      border: 1px solid #333;
      background: #191919;
      border-radius: 10px;
      font-size: 12px;
      z-index: 100;
      box-shadow: 0 8px 30px #0009;
    }

    .toast.hidden {
      display: none;
    }

    .empty-list {
      padding: 10px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: absolute;
        inset: 0 auto 0 0;
        width: min(285px, 85vw);
        box-shadow: 15px 0 40px #0008;
      }

      .sidebar.hidden {
        display: none;
      }

      .topbar {
        padding: 0 10px;
      }

      .messages {
        padding: 20px 14px 30px;
      }

      .composer-area {
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      }

      .user-bubble {
        max-width: 92%;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .welcome {
        padding: 25px 17px;
      }

      .chat-menu-button {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">kage</div>
      <button class="icon-button" id="close-sidebar" aria-label="close sidebar">‹</button>
    </div>

    <button class="new-chat" id="new-chat">
      <span>＋</span><span>new chat</span>
    </button>

    <div class="section-label">your chats</div>
    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-bottom">
      <button class="sidebar-action" id="export-chat">↗ <span>export chats</span></button>
      <button class="sidebar-action" id="import-chat">↙ <span>import chats</span></button>
      <button class="sidebar-action" id="sidebar-download">↓ <span>get kage on your device</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-button" id="open-sidebar" aria-label="open sidebar">☰</button>
        <div class="model-label">kage <span style="color:#666;font-weight:400">/ chat</span></div>
      </div>

      <div class="top-right">
        <div class="menu-wrap">
          <button class="icon-button" id="download-button" aria-label="get kage on your device" title="get kage on your device">↓</button>

          <div class="dropdown hidden" id="download-menu">
            <button data-device="iphone">iphone</button>
            <button data-device="ipad">ipad</button>
            <button data-device="android-phone">android phone</button>
            <button data-device="android-tablet">android / samsung tablet</button>
            <button data-device="computer">windows computer</button>
            <button data-device="laptop">laptop</button>
            <div class="download-info" id="download-info">
              choose your device for installation instructions.
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="conversation" id="conversation">
      <div class="welcome" id="welcome">
        <h1>what's on your mind?</h1>
        <p>just talk. kage's here.</p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="explain something complicated in a simple way">explain something complicated simply</button>
          <button class="suggestion" data-prompt="help me solve a problem step by step">help me solve a problem</button>
          <button class="suggestion" data-prompt="give me some creative ideas">come up with ideas</button>
          <button class="suggestion" data-prompt="tell me what's happening in the world right now">what's happening right now?</button>
        </div>
      </div>

      <div class="messages" id="messages" hidden></div>
    </section>

    <div class="composer-area">
      <div class="composer-wrap">
        <div class="status" id="status"></div>
        <div class="attachment-preview" id="attachment-preview"></div>

        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="message kage..." aria-label="message kage"></textarea>

          <div class="composer-bottom">
            <div class="composer-tools">
              <button class="tool-button" id="attach-button" aria-label="attach files" title="attach files">＋</button>
              <button class="tool-button" id="voice-button" aria-label="voice input" title="voice input">🎙</button>
            </div>

            <div class="composer-send">
              <button class="tool-button" id="speak-button" aria-label="read replies aloud" title="read replies aloud">◖))</button>
              <button class="send-button" id="send-button" aria-label="send message" title="send">↑</button>
            </div>
          </div>
        </div>

        <div class="footnote">kage can make mistakes. check important information.</div>
      </div>
    </div>
  </main>
</div>

<input type="file" id="file-input" hidden multiple>
<input type="file" id="import-input" hidden accept=".json,application/json">
<div class="toast hidden" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const STORAGE_CHATS = "kage-chats-v4";
  const STORAGE_ACTIVE = "kage-active-v4";

  const state = {
    chats: [],
    activeId: null,
    busy: false,
    attachments: [],
    lastMessages: [],
    speaking: false
  };

  const sidebar = $("sidebar");
  const chatList = $("chat-list");
  const conversation = $("conversation");
  const welcome = $("welcome");
  const messagesEl = $("messages");
  const promptEl = $("prompt");
  const sendButton = $("send-button");
  const statusEl = $("status");
  const attachmentPreview = $("attachment-preview");
  const downloadMenu = $("download-menu");
  const downloadInfo = $("download-info");

  function id() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function activeChat() {
    return state.chats.find(chat => chat.id === state.activeId);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_CHATS, JSON.stringify(state.chats));
      localStorage.setItem(STORAGE_ACTIVE, state.activeId || "");
    } catch (error) {
      showToast("couldn't save all chats in this browser");
    }
  }

  function createChat() {
    const chat = {
      id: id(),
      title: "New Chat",
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    state.chats.unshift(chat);
    state.activeId = chat.id;
    state.attachments = [];

    save();
    renderAll();
    promptEl.focus();

    return chat;
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_CHATS) || "[]");

      if (Array.isArray(saved)) {
        state.chats = saved.filter(chat =>
          chat &&
          typeof chat.id === "string" &&
          Array.isArray(chat.messages)
        );
      }
    } catch {
      state.chats = [];
    }

    const storedActive = localStorage.getItem(STORAGE_ACTIVE);
    state.activeId = state.chats.some(c => c.id === storedActive)
      ? storedActive
      : state.chats[0]?.id || null;

    if (!state.chats.length) createChat();
    else renderAll();
  }

  function showToast(text) {
    const toast = $("toast");
    toast.textContent = text;
    toast.classList.remove("hidden");

    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.add("hidden"), 2300);
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function safeURL(value) {
    try {
      const url = new URL(value, location.href);
      if (url.protocol === "http:" || url.protocol === "https:") {
        return url.href;
      }
    } catch {}
    return "";
  }

  function renderMarkdown(input) {
    let text = escapeHTML(input || "");
    const codeBlocks = [];

    text = text.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, language, code) => {
      const index = codeBlocks.length;
      codeBlocks.push(
        `<pre><code>${code.replace(/\n$/, "")}</code></pre>`
      );
      return `@@CODEBLOCK${index}@@`;
    });

    text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.+)$/gm, "<h1>$1</h1>");
    text = text.replace(/^&gt; ?(.*)$/gm, "<blockquote>$1</blockquote>");
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

    text = text.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (_, label, url) => {
        const safe = safeURL(url);
        return safe
          ? `<a href="${escapeHTML(safe)}" target="_blank" rel="noopener noreferrer">${label}</a>`
          : label;
      }
    );

    text = text.replace(
      /(^|\s)(https?:\/\/[^\s<]+)/g,
      (full, before, rawUrl) => {
        const trimmed = rawUrl.replace(/[.,!?;:)]+$/, "");
        const suffix = rawUrl.slice(trimmed.length);
        const safe = safeURL(trimmed);
        return safe
          ? `${before}<a href="${escapeHTML(safe)}" target="_blank" rel="noopener noreferrer">${trimmed}</a>${suffix}`
          : full;
      }
    );

    text = text.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
    text = text.replace(/(?:<li>.*<\/li>\n?)+/gs, match => `<ul>${match}</ul>`);
    text = text.replace(/^\s*\d+\. (.+)$/gm, "<li>$1</li>");
    text = text.replace(/\n{2,}/g, "</p><p>");
    text = text.replace(/\n/g, "<br>");

    text = `<p>${text}</p>`;

    text = text.replace(
      /<p>(<h[1-3]>[\s\S]*?<\/h[1-3]>)<\/p>/g,
      "$1"
    );

    text = text.replace(
      /@@CODEBLOCK(\d+)@@/g,
      (_, index) => codeBlocks[Number(index)] || ""
    );

    return text;
  }

  function renderChatList() {
    chatList.innerHTML = "";

    if (!state.chats.length) {
      chatList.innerHTML = '<div class="empty-list">no chats yet</div>';
      return;
    }

    for (const chat of state.chats) {
      const row = document.createElement("div");
      row.className = "chat-item" + (chat.id === state.activeId ? " active" : "");

      const select = document.createElement("button");
      select.className = "chat-select";
      select.textContent = chat.title || "New Chat";
      select.title = select.textContent;
      select.addEventListener("click", () => {
        state.activeId = chat.id;
        state.attachments = [];
        save();
        renderAll();
      });

      const menuButton = document.createElement("button");
      menuButton.className = "chat-menu-button";
      menuButton.textContent = "···";
      menuButton.title = "chat options";
      menuButton.setAttribute("aria-label", "chat options");

      menuButton.addEventListener("click", event => {
        event.stopPropagation();
        showChatOptions(chat.id);
      });

      row.append(select, menuButton);
      chatList.append(row);
    }
  }

  function showChatOptions(chatId) {
    const chat = state.chats.find(c => c.id === chatId);
    if (!chat) return;

    const action = window.prompt(
      `chat: ${chat.title}\n\nenter 1 to rename\nenter 2 to delete`
    );

    if (action === "1") {
      const nextTitle = window.prompt("new chat name:", chat.title);
      if (nextTitle && nextTitle.trim()) {
        chat.title = nextTitle.trim().slice(0, 80);
        save();
        renderChatList();
      }
    }

    if (action === "2") {
      if (!window.confirm(`delete "${chat.title}"?`)) return;

      state.chats = state.chats.filter(c => c.id !== chatId);

      if (state.activeId === chatId) {
        state.activeId = state.chats[0]?.id || null;
      }

      if (!state.chats.length) createChat();

      save();
      renderAll();
    }
  }

  function renderMessages() {
    const chat = activeChat();

    welcome.hidden = !!(chat && chat.messages.length);
    messagesEl.hidden = !(chat && chat.messages.length);
    messagesEl.innerHTML = "";

    if (!chat) return;

    for (let index = 0; index < chat.messages.length; index++) {
      const message = chat.messages[index];
      const wrapper = document.createElement("article");
      wrapper.className = `message ${message.role}`;

      if (message.role === "user") {
        const bubble = document.createElement("div");
        bubble.className = "user-bubble";

        if (message.attachments?.length) {
          const files = document.createElement("div");
          files.className = "file-chips";

          for (const file of message.attachments) {
            const chip = document.createElement("div");
            chip.className = "file-chip";
            chip.textContent = file.name;
            files.append(chip);
          }

          bubble.append(files);
        }

        const content = document.createElement("div");
        content.textContent = message.content || "";
        bubble.append(content);
        wrapper.append(bubble);
      } else {
        const body = document.createElement("div");
        body.className = "assistant-message";
        body.innerHTML = renderMarkdown(message.content || "");
        wrapper.append(body);

        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copy = document.createElement("button");
        copy.textContent = "copy";
        copy.addEventListener("click", () => copyText(message.content || ""));

        const regenerate = document.createElement("button");
        regenerate.textContent = "regenerate";
        regenerate.addEventListener("click", () => regenerateResponse(index));

        actions.append(copy, regenerate);
        wrapper.append(actions);
      }

      if (message.role === "user") {
        const actions = document.createElement("div");
        actions.className = "message-actions";

        const edit = document.createElement("button");
        edit.textContent = "edit";
        edit.addEventListener("click", () => editMessage(index));

        const copy = document.createElement("button");
        copy.textContent = "copy";
        copy.addEventListener("click", () => copyText(message.content || ""));

        actions.append(edit, copy);
        wrapper.append(actions);
      }

      messagesEl.append(wrapper);
    }

    conversation.scrollTop = conversation.scrollHeight;
  }

  function renderAttachments() {
    attachmentPreview.innerHTML = "";

    state.attachments.forEach((file, index) => {
      const item = document.createElement("div");
      item.className = "attachment-item";

      const name = document.createElement("span");
      name.textContent = file.name;
      name.title = file.name;

      const remove = document.createElement("button");
      remove.textContent = "×";
      remove.setAttribute("aria-label", `remove ${file.name}`);
      remove.addEventListener("click", () => {
        state.attachments.splice(index, 1);
        renderAttachments();
      });

      item.append(name, remove);
      attachmentPreview.append(item);
    });
  }

  function renderAll() {
    renderChatList();
    renderMessages();
    renderAttachments();
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast("copied");
    } catch {
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.append(temp);
      temp.select();
      document.execCommand("copy");
      temp.remove();
      showToast("copied");
    }
  }

  async function updateTitle(chat) {
    if (!chat || !chat.messages.some(m => m.role === "user")) return;

    try {
      const response = await fetch("/api/title", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chat.messages })
      });

      if (!response.ok) return;

      const data = await response.json();
      const title = String(data.title || "")
        .trim()
        .split(/\s+/)
        .slice(0, 3)
        .join(" ");

      if (title) {
        chat.title = title;
        chat.updatedAt = Date.now();
        save();
        renderChatList();
      }
    } catch {
      // Keep the existing title if automatic naming is temporarily unavailable.
    }
  }

  async function readFile(file) {
    const MAX_FILE_SIZE = 4 * 1024 * 1024;

    if (file.size > MAX_FILE_SIZE) {
      throw new Error(`${file.name} is larger than 4 MB`);
    }

    const base = {
      name: file.name,
      type: file.type || "application/octet-stream",
      size: file.size
    };

    if (file.type.startsWith("image/")) {
      return {
        ...base,
        dataUrl: await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        })
      };
    }

    const textLike =
      file.type.startsWith("text/") ||
      /\.(txt|md|csv|json|js|jsx|ts|tsx|html|css|xml|yaml|yml|py|java|c|cpp|h|sql|log)$/i.test(file.name);

    if (textLike) {
      const text = await file.text();

      return {
        ...base,
        text: text.slice(0, 60000)
      };
    }

    return {
      ...base,
      text: ""
    };
  }

  async function attachFiles(files) {
    for (const file of Array.from(files || [])) {
      try {
        const parsed = await readFile(file);
        state.attachments.push(parsed);
      } catch (error) {
        showToast(error.message || "couldn't read that file");
      }
    }

    renderAttachments();
  }

  function buildUserContent(text, attachments) {
    const sections = [];

    if (text.trim()) sections.push(text.trim());

    for (const file of attachments) {
      if (file.text) {
        sections.push(
          `\n[file: ${file.name}]\n${file.text}\n[/file]`
        );
      } else {
        sections.push(`[attached file: ${file.name}]`);
      }
    }

    return sections.join("\n\n");
  }

  function getApiMessages(chat) {
    return chat.messages.map(message => ({
      role: message.role,
      content: message.content || ""
    }));
  }

  async function sendMessage(textOverride) {
    if (state.busy) return;

    const text = typeof textOverride === "string"
      ? textOverride
      : promptEl.value;

    const attachments = state.attachments.slice();

    if (!text.trim() && !attachments.length) return;

    let chat = activeChat();
    if (!chat) chat = createChat();

    const content = buildUserContent(text, attachments);

    chat.messages.push({
      role: "user",
      content,
      attachments: attachments.map(file => ({
        name: file.name,
        type: file.type,
        size: file.size
      })),
      timestamp: Date.now()
    });

    chat.updatedAt = Date.now();

    if (chat.title === "New Chat") {
      const firstWords = text.trim().split(/\s+/).slice(0, 3).join(" ");
      if (firstWords) chat.title = firstWords;
    }

    state.attachments = [];
    promptEl.value = "";
    resizePrompt();
    renderAll();
    save();

    await requestReply(chat);
  }

  async function requestReply(chat) {
    if (state.busy) return;

    state.busy = true;
    sendButton.disabled = true;
    statusEl.textContent = "thinking...";

    const assistantMessage = {
      role: "assistant",
      content: "",
      timestamp: Date.now()
    };

    chat.messages.push(assistantMessage);
    renderMessages();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: getApiMessages(chat)
        })
      });

      if (!response.ok) {
        let errorMessage = `request failed (${response.status})`;

        try {
          const errorData = await response.json();
          if (errorData.error) errorMessage = errorData.error;
          if (errorData.details) errorMessage += `: ${errorData.details}`;
        } catch {}

        throw new Error(errorMessage);
      }

      if (!response.body) {
        throw new Error("the server returned an empty response");
      }

      statusEl.textContent = "";

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || "";

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;

          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;

          try {
            const parsed = JSON.parse(payload);

            if (parsed.response) {
              assistantMessage.content += parsed.response;
            } else if (parsed.choices?.[0]?.delta?.content) {
              assistantMessage.content += parsed.choices[0].delta.content;
            } else if (parsed.delta) {
              assistantMessage.content += parsed.delta;
            } else if (parsed.text) {
              assistantMessage.content += parsed.text;
            }
          } catch {
            // Ignore non-JSON SSE lines.
          }

          renderMessages();
        }
      }

      if (!assistantMessage.content.trim()) {
        throw new Error("the model returned no readable text");
      }

      chat.updatedAt = Date.now();
      save();
      await updateTitle(chat);
    } catch (error) {
      assistantMessage.content = assistantMessage.content
        ? assistantMessage.content + "\n\nsomething interrupted the response. try again."
        : `couldn't get a reply: ${error.message}`;

      save();
      renderMessages();
    } finally {
      state.busy = false;
      sendButton.disabled = false;
      statusEl.textContent = "";
      renderChatList();
      promptEl.focus();
    }
  }

  function editMessage(index) {
    const chat = activeChat();
    if (!chat || state.busy) return;

    const message = chat.messages[index];
    if (!message || message.role !== "user") return;

    const updated = window.prompt("edit your message:", message.content);
    if (updated === null) return;

    chat.messages = chat.messages.slice(0, index);
    chat.messages.push({
      role: "user",
      content: updated,
      timestamp: Date.now()
    });

    save();
    renderMessages();
    requestReply(chat);
  }

  function regenerateResponse(index) {
    const chat = activeChat();
    if (!chat || state.busy) return;

    chat.messages = chat.messages.slice(0, index);
    save();
    renderMessages();
    requestReply(chat);
  }

  function resizePrompt() {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 190) + "px";
  }

  function toggleSidebar() {
    sidebar.classList.toggle("hidden");
  }

  function closeMenus(except) {
    if (except !== downloadMenu) downloadMenu.classList.add("hidden");
  }

  function openDownloadMenu() {
    downloadMenu.classList.toggle("hidden");
  }

  function deviceInstructions(device) {
    const instructions = {
      iphone:
        "open kage in safari, tap the share button, then choose “add to home screen.” this creates a home-screen shortcut.",
      ipad:
        "open kage in safari, tap the share button, then choose “add to home screen.”",
      "android-phone":
        "open kage in chrome, tap the three-dot menu, then choose “install app” or “add to home screen” if available.",
      "android-tablet":
        "open kage in chrome, tap the three-dot menu, then choose “install app” or “add to home screen” if available.",
      computer:
        "open kage in microsoft edge or chrome. use the browser's install option if available, or create a desktop shortcut.",
      laptop:
        "open kage in your browser. use its install option if available, or create a shortcut from the browser menu."
    };

    downloadInfo.textContent = instructions[device] ||
      "open kage in your device's browser and use its install or add-to-home-screen option if available.";
  }

  function exportChats() {
    const blob = new Blob(
      [JSON.stringify(state.chats, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kage-chats.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importChats(file) {
    if (!file) return;

    try {
      const parsed = JSON.parse(await file.text());
      if (!Array.isArray(parsed)) throw new Error("invalid chat file");

      const valid = parsed.filter(chat =>
        chat &&
        typeof chat.id === "string" &&
        Array.isArray(chat.messages)
      );

      if (!valid.length) throw new Error("no valid chats found");

      const existingIds = new Set(state.chats.map(chat => chat.id));

      for (const chat of valid) {
        if (existingIds.has(chat.id)) chat.id = id();
        state.chats.push(chat);
      }

      state.chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      state.activeId = valid[0].id;

      save();
      renderAll();
      showToast("chats imported");
    } catch (error) {
      showToast(error.message || "couldn't import chats");
    }
  }

  async function toggleVoiceInput() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Recognition) {
      showToast("voice input isn't supported in this browser");
      return;
    }

    const recognition = new Recognition();
    recognition.lang = "en-US";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      statusEl.textContent = "listening...";
      $("voice-button").style.color = "#fff";
    };

    recognition.onresult = event => {
      let result = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        result += event.results[i][0].transcript;
      }

      promptEl.value = result;
      resizePrompt();
    };

    recognition.onerror = () => {
      statusEl.textContent = "";
      showToast("voice input stopped");
    };

    recognition.onend = () => {
      statusEl.textContent = "";
      $("voice-button").style.color = "";
    };

    recognition.start();
  }

  function speakLastReply() {
    if (!("speechSynthesis" in window)) {
      showToast("read aloud isn't supported in this browser");
      return;
    }

    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
      state.speaking = false;
      return;
    }

    const chat = activeChat();
    const lastReply = [...(chat?.messages || [])]
      .reverse()
      .find(message => message.role === "assistant" && message.content);

    if (!lastReply) {
      showToast("no reply to read yet");
      return;
    }

    const utterance = new SpeechSynthesisUtterance(lastReply.content);
    utterance.rate = 1.05;
    utterance.onend = () => {
      state.speaking = false;
    };

    state.speaking = true;
    speechSynthesis.speak(utterance);
  }

  $("new-chat").addEventListener("click", createChat);
  $("open-sidebar").addEventListener("click", toggleSidebar);
  $("close-sidebar").addEventListener("click", toggleSidebar);

  $("send-button").addEventListener("click", () => sendMessage());

  promptEl.addEventListener("input", resizePrompt);

  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  $("attach-button").addEventListener("click", () => $("file-input").click());

  $("file-input").addEventListener("change", async event => {
    await attachFiles(event.target.files);
    event.target.value = "";
  });

  $("voice-button").addEventListener("click", toggleVoiceInput);
  $("speak-button").addEventListener("click", speakLastReply);

  $("export-chat").addEventListener("click", exportChats);
  $("import-chat").addEventListener("click", () => $("import-input").click());

  $("import-input").addEventListener("change", async event => {
    await importChats(event.target.files[0]);
    event.target.value = "";
  });

  $("download-button").addEventListener("click", event => {
    event.stopPropagation();
    openDownloadMenu();
  });

  $("sidebar-download").addEventListener("click", () => {
    downloadMenu.classList.remove("hidden");
    downloadInfo.textContent =
      "choose your device above for installation instructions.";
    if (window.innerWidth <= 700) sidebar.classList.add("hidden");
  });

  downloadMenu.querySelectorAll("[data-device]").forEach(button => {
    button.addEventListener("click", () => {
      deviceInstructions(button.dataset.device);
    });
  });

  document.addEventListener("click", event => {
    if (!event.target.closest(".menu-wrap")) closeMenus();
  });

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      promptEl.value = button.dataset.prompt;
      resizePrompt();
      promptEl.focus();
    });
  });

  window.addEventListener("beforeunload", save);

  load();
})();
</script>
</body>
</html>
